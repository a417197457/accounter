    details.statement,details.answer{border-top:1px solid var(--line)}details.statement>summary,details.answer>summary{cursor:pointer;list-style:none;padding:13px 18px;color:#b8cce1;font-weight:700;background:rgba(7,17,31,.32)}details.statement>summary::-webkit-details-marker,details.answer>summary::-webkit-details-marker{display:none}details.statement>summary:after,details.answer>summary:after{content:'＋';float:right;color:var(--cyan)}details.statement[open]>summary:after,details.answer[open]>summary:after{content:'－'}.statementBody{padding:18px;color:#d5e0eb;background:#091625;white-space:pre-wrap;font-size:.93rem;line-height:1.8}.answerBody{padding:18px}.idea{margin:0 0 16px;color:#d5e0eb;background:#0a1726;border-left:3px solid var(--cyan);padding:12px 14px;border-radius:0 10px 10px 0}.tabs{display:flex;gap:8px;margin-bottom:8px}.tab{border:1px solid var(--line);background:#0c1a2a;color:#91a8c1;padding:7px 14px;border-radius:9px;cursor:pointer}.tab.active{color:#07111f;background:var(--cyan);border-color:var(--cyan);font-weight:800}.codeWrap{position:relative}.copy{position:absolute;right:9px;top:9px;border:1px solid #35506c;background:#11253a;color:#aac0d7;border-radius:8px;padding:5px 9px;cursor:pointer}pre{margin:0;max-height:520px;overflow:auto;padding:18px;background:#06101c;border:1px solid #1c3045;border-radius:12px;color:#d8e8f8;font:14px/1.6 "SFMono-Regular",Consolas,monospace;tab-size:4}.empty{border:1px dashed #35506c;border-radius:16px;padding:48px;text-align:center;color:var(--muted)}footer{margin:32px 0 10px;color:#71859b;font-size:.78rem;text-align:center}footer a{color:#91aac4}

  <script>
    const problems = [{"id": 217, "title": "存在重复元素", "enTitle": "Contains Duplicate", "category": "数组与哈希", "difficulty": "简单", "summary": "给你一个整数数组 nums 。如果任一值在数组中出现 至少两次 ，返回 true ；如果数组中每个元素互不相同，返回 false 。 示例 1： 输入： nums = [1,2,3,1] 输出： true 解释： 元素 1 在下标 0 和 3 出现。 示例 2： 输入： nums = [1,2,3,4] 输出： false 解释： 所有元素都不同。 示例 3： 输入： nums = [1,1,1,3,3,4,3,2,4,2] 输出： t…", "description": "给你一个整数数组 nums 。如果任一值在数组中出现 至少两次 ，返回 true ；如果数组中每个元素互不相同，返回 false 。\n示例 1：\n输入：nums = [1,2,3,1]\n输出：true\n解释：\n元素 1 在下标 0 和 3 出现。\n示例 2：\n输入：nums = [1,2,3,4]\n输出：false\n解释：\n所有元素都不同。\n示例 3：\n输入：nums = [1,1,1,3,3,4,3,2,4,2]\n输出：true\n提示：\n• 1 <= nums.length <= 105\n• -109 <= nums[i] <= 109", "idea": "方法一：排序 我们先对数组 nums 进行排序。 然后遍历数组，如果存在相邻两个元素相同，说明数组中存在重复元素，直接返回 true。 否则，遍历结束，返回 false。 时间复杂度 O(n \\times \\log n)。其中 n 是数组 nums 的长度。", "tags": ["数组", "哈希表", "排序"], "url": "https://leetcode.cn/problems/contains-duplicate/", "go": "func containsDuplicate(nums []int) bool {\n\tsort.Ints(nums)\n\tfor i, v := range nums[1:] {\n\t\tif v == nums[i] {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}", "java": "class Solution {\n    public boolean containsDuplicate(int[] nums) {\n        Arrays.sort(nums);\n        for (int i = 0; i < nums.length - 1; ++i) {\n            if (nums[i] == nums[i + 1]) {\n                return true;\n            }\n        }\n        return false;\n    }\n}"}, {"id": 242, "title": "有效的字母异位词", "enTitle": "Valid Anagram", "category": "数组与哈希", "difficulty": "简单", "summary": "给定两个字符串 s 和 t ，编写一个函数来判断 t 是否是 s 的 字母异位词 。 示例 1: 示例 2: 提示: 1 <= s.length, t.length <= 5 10 4 s 和 t 仅包含小写字母 进阶: 如果输入字符串包含 unicode 字符怎么办？你能否调整你的解法来应对这种情况？", "description": "给定两个字符串 s 和 t ，编写一个函数来判断 t 是否是 s 的 字母异位词。\n示例 1:\n输入: s = \"anagram\", t = \"nagaram\"\n输出: true\n示例 2:\n输入: s = \"rat\", t = \"car\"\n输出: false\n提示:\n• 1 <= s.length, t.length <= 5 * 104\n• s 和 t 仅包含小写字母\n进阶: 如果输入字符串包含 unicode 字符怎么办？你能否调整你的解法来应对这种情况？", "idea": "方法一：计数 我们先判断两个字符串的长度是否相等，如果不相等，说明两个字符串中的字符肯定不同，返回 false。 否则，我们用哈希表或者一个长度为 26 的数组来记录字符串 s 中每个字符出现的次数，然后遍历另一个字符串 t，每遍历到一个字符，就将哈希表中对应的字符次数减一，如果减一后的次数小于 0，说明该字符在两个字符串中出现的次数不同，返回 false。如果遍历完两个字符串后，哈希表中的所有字符次数都为 0，说明两个字符串中的字符出现次数相同，返回 true。 时间复杂度 O(n)，空间复杂度 O(C)，其中 n 是字符串的长度；而 C 是字符集的大小，本题中 C=26。", "tags": ["哈希表", "字符串", "排序"], "url": "https://leetcode.cn/problems/valid-anagram/", "go": "func isAnagram(s string, t string) bool {\n\tif len(s) != len(t) {\n\t\treturn false\n\t}\n\tcnt := [26]int{}\n\tfor i := 0; i < len(s); i++ {\n\t\tcnt[s[i]-'a']++\n\t\tcnt[t[i]-'a']--\n\t}\n\tfor _, v := range cnt {\n\t\tif v != 0 {\n\t\t\treturn false\n\t\t}\n\t}\n\treturn true\n}", "java": "class Solution {\n    public boolean isAnagram(String s, String t) {\n        if (s.length() != t.length()) {\n            return false;\n        }\n        int[] cnt = new int[26];\n        for (int i = 0; i < s.length(); ++i) {\n            ++cnt[s.charAt(i) - 'a'];\n            --cnt[t.charAt(i) - 'a'];\n        }\n        for (int i = 0; i < 26; ++i) {\n            if (cnt[i] != 0) {\n                return false;\n            }\n        }\n        return true;\n    }\n}"}, {"id": 1, "title": "两数之和", "enTitle": "Two Sum", "category": "数组与哈希", "difficulty": "简单", "summary": "给定一个整数数组 nums 和一个整数目标值 target ，请你在该数组中找出 和为目标值 target 的那 两个 整数，并返回它们的数组下标。 你可以假设每种输入只会对应一个答案，并且你不能使用两次相同的元素。 你可以按任意顺序返回答案。 示例 1： 示例 2： 示例 3： 提示： 2 <= nums.length <= 10 4 10 9 <= nums[i] <= 10 9 10 9 <= target <= 10 9 只会存…", "description": "给定一个整数数组 nums 和一个整数目标值 target，请你在该数组中找出 和为目标值 target  的那 两个 整数，并返回它们的数组下标。\n你可以假设每种输入只会对应一个答案，并且你不能使用两次相同的元素。\n你可以按任意顺序返回答案。\n示例 1：\n输入：nums = [2,7,11,15], target = 9\n输出：[0,1]\n解释：因为 nums[0] + nums[1] == 9 ，返回 [0, 1] 。\n示例 2：\n输入：nums = [3,2,4], target = 6\n输出：[1,2]\n示例 3：\n输入：nums = [3,3], target = 6\n输出：[0,1]\n提示：\n• 2 <= nums.length <= 104\n• -109 <= nums[i] <= 109\n• -109 <= target <= 109\n• 只会存在一个有效答案\n进阶：你可以想出一个时间复杂度小于 O(n2) 的算法吗？", "idea": "方法一：哈希表 我们可以使用一个哈希表 \\textit{d} 来存储每个元素及其对应的索引。 遍历数组 \\textit{nums}，对于当前元素 \\textit{nums}[i]，我们首先判断 \\textit{target} \\textit{nums}[i] 是否在哈希表 \\textit{d} 中，如果在 \\textit{d} 中，说明 \\textit{target} 值已经找到，返回 \\textit{target} \\textit{nums}[i] 的索引和 i 即可。 时间复杂度 O(n)，空间复杂度 O(n)，其中 n 为数组 \\textit{nums} 的长度。", "tags": ["数组", "哈希表"], "url": "https://leetcode.cn/problems/two-sum/", "go": "func twoSum(nums []int, target int) []int {\n\td := map[int]int{}\n\tfor i := 0; ; i++ {\n\t\tx := nums[i]\n\t\ty := target - x\n\t\tif j, ok := d[y]; ok {\n\t\t\treturn []int{j, i}\n\t\t}\n\t\td[x] = i\n\t}\n}", "java": "class Solution {\n    public int[] twoSum(int[] nums, int target) {\n        Map<Integer, Integer> d = new HashMap<>();\n        for (int i = 0;; ++i) {\n            int x = nums[i];\n            int y = target - x;\n            if (d.containsKey(y)) {\n                return new int[] {d.get(y), i};\n            }\n            d.put(x, i);\n        }\n    }\n}"}, {"id": 49, "title": "字母异位词分组", "enTitle": "Group Anagrams", "category": "数组与哈希", "difficulty": "中等", "summary": "给你一个字符串数组，请你将 字母异位词 组合在一起。可以按任意顺序返回结果列表。 示例 1: 输入: strs = [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"] 输出: [[\"bat\"],[\"nat\",\"tan\"],[\"ate\",\"eat\",\"tea\"]] 解释： 在 strs 中没有字符串可以通过重新排列来形成 \"bat\" 。 字符串 \"nat\" 和 \"tan\" 是字母异位词，因为它们可以重新排…", "description": "给你一个字符串数组，请你将 字母异位词 组合在一起。可以按任意顺序返回结果列表。\n示例 1:\n输入: strs = [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]\n输出: [[\"bat\"],[\"nat\",\"tan\"],[\"ate\",\"eat\",\"tea\"]]\n解释：\n• 在 strs 中没有字符串可以通过重新排列来形成 \"bat\"。\n• 字符串 \"nat\" 和 \"tan\" 是字母异位词，因为它们可以重新排列以形成彼此。\n• 字符串 \"ate\" ，\"eat\" 和 \"tea\" 是字母异位词，因为它们可以重新排列以形成彼此。\n示例 2:\n输入: strs = [\"\"]\n输出: [[\"\"]]\n示例 3:\n输入: strs = [\"a\"]\n输出: [[\"a\"]]\n提示：\n• 1 <= strs.length <= 104\n• 0 <= strs[i].length <= 100\n• strs[i] 仅包含小写字母", "idea": "方法一：哈希表 1. 遍历字符串，对每个字符串按照字符字典序排序，得到一个新的字符串。 2. 以新字符串为 key，[str] 为 value，存入哈希表当中（HashMap ）。 3. 后续遍历得到相同 key 时，将其加入到对应的 value 当中即可。 以 strs = [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"] 为例，遍历结束时，哈希表的状况： | key | value | | | | | \"aet\" | [\"eat\", \"tea\", \"ate\"] | | \"ant\" | [\"tan\", \"nat\"] | | \"abt\" | [\"bat\"] | 最后返回哈希表的 value 列表即可。 时间复杂度 O(n\\times k\\times \\log k)。其中 n 和 k 分别是字符串数组的长度和字符串的最大长度。", "tags": ["数组", "哈希表", "字符串", "排序"], "url": "https://leetcode.cn/problems/group-anagrams/", "go": "func groupAnagrams(strs []string) (ans [][]string) {\n\td := map[string][]string{}\n\tfor _, s := range strs {\n\t\tt := []byte(s)\n\t\tsort.Slice(t, func(i, j int) bool { return t[i] < t[j] })\n\t\tk := string(t)\n\t\td[k] = append(d[k], s)\n\t}\n\tfor _, v := range d {\n\t\tans = append(ans, v)\n\t}\n\treturn\n}", "java": "class Solution {\n    public List<List<String>> groupAnagrams(String[] strs) {\n        Map<String, List<String>> d = new HashMap<>();\n        for (String s : strs) {\n            char[] t = s.toCharArray();\n            Arrays.sort(t);\n            String k = String.valueOf(t);\n            d.computeIfAbsent(k, key -> new ArrayList<>()).add(s);\n        }\n        return new ArrayList<>(d.values());\n    }\n}"}, {"id": 347, "title": "前 K 个高频元素", "enTitle": "Top K Frequent Elements", "category": "数组与哈希", "difficulty": "中等", "summary": "给你一个整数数组 nums 和一个整数 k ，请你返回其中出现频率前 k 高的元素。你可以按 任意顺序 返回答案。 示例 1： 输入： nums = [1,1,1,2,2,3], k = 2 输出： [1,2] 示例 2： 输入： nums = [1], k = 1 输出： [1] 示例 3： 输入： nums = [1,2,1,2,1,2,3,1,3,2], k = 2 输出： [1,2] 提示： 1 <= nums.length <…", "description": "给你一个整数数组 nums 和一个整数 k ，请你返回其中出现频率前 k 高的元素。你可以按 任意顺序 返回答案。\n示例 1：\n输入：nums = [1,1,1,2,2,3], k = 2\n输出：[1,2]\n示例 2：\n输入：nums = [1], k = 1\n输出：[1]\n示例 3：\n输入：nums = [1,2,1,2,1,2,3,1,3,2], k = 2\n输出：[1,2]\n提示：\n• 1 <= nums.length <= 105\n• -104 <= nums[i] <= 104\n• k 的取值范围是 [1, 数组中不相同的元素的个数]\n• 题目数据保证答案唯一，换句话说，数组中前 k 个高频元素的集合是唯一的\n进阶：你所设计算法的时间复杂度 必须 优于 O(n log n) ，其中 n 是数组大小。", "idea": "方法一：哈希表 + 优先队列（小根堆） 我们可以使用一个哈希表 \\textit{cnt} 统计每个元素出现的次数，然后使用一个小根堆（优先队列）来保存前 k 个高频元素。 我们首先遍历一遍数组，统计每个元素出现的次数，然后遍历哈希表，将元素和出现次数存入小根堆中。如果小根堆的大小超过了 k，我们就将堆顶元素弹出，保证堆的大小始终为 k。 最后，我们将小根堆中的元素依次弹出，放入结果数组中即可。 时间复杂度 O(n \\times \\log k)，空间复杂度 O(k)。其中 n 是数组的长度。", "tags": ["数组", "哈希表", "分治", "桶排序"], "url": "https://leetcode.cn/problems/top-k-frequent-elements/", "go": "func topKFrequent(nums []int, k int) []int {\n\tcnt := map[int]int{}\n\tfor _, x := range nums {\n\t\tcnt[x]++\n\t}\n\tpq := hp{}\n\tfor x, c := range cnt {\n\t\theap.Push(&pq, pair{x, c})\n\t\tif pq.Len() > k {\n\t\t\theap.Pop(&pq)\n\t\t}\n\t}\n\tans := make([]int, k)\n\tfor i := 0; i < k; i++ {\n\t\tans[i] = heap.Pop(&pq).(pair).v\n\t}\n\treturn ans\n}\n\ntype pair struct{ v, cnt int }\ntype hp []pair\n\nfunc (h hp) Len() int           { return len(h) }\nfunc (h hp) Less(i, j int) bool { return h[i].cnt < h[j].cnt }\nfunc (h hp) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }\nfunc (h *hp) Push(v any)        { *h = append(*h, v.(pair)) }\nfunc (h *hp) Pop() any          { a := *h; v := a[len(a)-1]; *h = a[:len(a)-1]; return v }", "java": "class Solution {\n    public int[] topKFrequent(int[] nums, int k) {\n        Map<Integer, Integer> cnt = new HashMap<>();\n        for (int x : nums) {\n            cnt.merge(x, 1, Integer::sum);\n        }\n        PriorityQueue<Map.Entry<Integer, Integer>> pq\n            = new PriorityQueue<>(Comparator.comparingInt(Map.Entry::getValue));\n        for (var e : cnt.entrySet()) {\n            pq.offer(e);\n            if (pq.size() > k) {\n                pq.poll();\n            }\n        }\n        return pq.stream().mapToInt(Map.Entry::getKey).toArray();\n    }\n}"}, {"id": 271, "title": "字符串的编码与解码 🔒", "enTitle": "Encode and Decode Strings", "category": "数组与哈希", "difficulty": "中等", "summary": "请你设计一个算法，可以将一个 字符串列表 编码成为一个 字符串 。这个编码后的字符串是可以通过网络进行高效传送的，并且可以在接收端被解码回原来的字符串列表。 1 号机（发送方）有如下函数： 2 号机（接收方）有如下函数： 1 号机（发送方）执行： 2 号机（接收方）执行： 此时，2 号机（接收方）的 strs2 需要和 1 号机（发送方）的 strs 相同。 请你来实现这个 encode 和 decode 方法。 不允许使用任何序列化方…", "description": "请你设计一个算法，可以将一个 字符串列表 编码成为一个 字符串。这个编码后的字符串是可以通过网络进行高效传送的，并且可以在接收端被解码回原来的字符串列表。\n1 号机（发送方）有如下函数：\nstring encode(vector<string> strs) {\n// ... your code\nreturn encoded_string;\n}\n2 号机（接收方）有如下函数：\nvector<string> decode(string s) {\n//... your code\nreturn strs;\n}\n1 号机（发送方）执行：\nstring encoded_string = encode(strs);\n2 号机（接收方）执行：\nvector<string> strs2 = decode(encoded_string);\n此时，2 号机（接收方）的 strs2 需要和 1 号机（发送方）的 strs 相同。\n请你来实现这个 encode 和 decode 方法。\n不允许使用任何序列化方法解决这个问题（例如 eval）。\n示例 1：\n输入：dummy_input = [\"Hello\",\"World\"]\n输出：[\"Hello\",\"World\"]\n解释：\n1 号机：\nCodec encoder = new Codec();\nString msg = encoder.encode(strs);\nMachine 1 ---msg---> Machine 2\n2 号机：\nCodec decoder = new Codec();\nString[] strs = decoder.decode(msg);\n示例 2：\n输入：dummy_input = [\"\"]\n输出：[\"\"]\n提示：\n• 1 <= strs.length <= 200\n• 0 <= strs[i].length <= 200\n• strs[i] 包含 256 个有效 ASCII 字符中的任何可能字符。\n进阶：你能编写一个通用算法来处理任何可能的字符集吗？", "idea": "方法一：编码字符串长度 编码时，将字符串的长度转成固定 4 位的字符串，加上字符串本身，依次拼接到结果字符串。 解码时，先取前四位字符串，得到长度，再通过长度截取后面的字符串。依次截取，最终得到字符串列表。 时间复杂度 O(n)。", "tags": ["设计", "数组", "字符串"], "url": "https://leetcode.cn/problems/encode-and-decode-strings/", "go": "type Codec struct {\n}\n\n// Encodes a list of strings to a single string.\nfunc (codec *Codec) Encode(strs []string) string {\n\tans := &bytes.Buffer{}\n\tfor _, s := range strs {\n\t\tt := fmt.Sprintf(\"%04d\", len(s))\n\t\tans.WriteString(t)\n\t\tans.WriteString(s)\n\t}\n\treturn ans.String()\n}\n\n// Decodes a single string to a list of strings.\nfunc (codec *Codec) Decode(strs string) []string {\n\tans := []string{}\n\ti, n := 0, len(strs)\n\tfor i < n {\n\t\tt := strs[i : i+4]\n\t\ti += 4\n\t\tsize, _ := strconv.Atoi(t)\n\t\tans = append(ans, strs[i:i+size])\n\t\ti += size\n\t}\n\treturn ans\n}\n\n// Your Codec object will be instantiated and called as such:\n// var codec Codec\n// codec.Decode(codec.Encode(strs));", "java": "public class Codec {\n\n    // Encodes a list of strings to a single string.\n    public String encode(List<String> strs) {\n        StringBuilder ans = new StringBuilder();\n        for (String s : strs) {\n            ans.append((char) s.length()).append(s);\n        }\n        return ans.toString();\n    }\n\n    // Decodes a single string to a list of strings.\n    public List<String> decode(String s) {\n        List<String> ans = new ArrayList<>();\n        int i = 0, n = s.length();\n        while (i < n) {\n            int size = s.charAt(i++);\n            ans.add(s.substring(i, i + size));\n            i += size;\n        }\n        return ans;\n    }\n}\n\n// Your Codec object will be instantiated and called as such:\n// Codec codec = new Codec();\n// codec.decode(codec.encode(strs));"}, {"id": 238, "title": "除了自身以外数组的乘积", "enTitle": "Product of Array Except Self", "category": "数组与哈希", "difficulty": "中等", "summary": "给你一个整数数组 nums ，返回 数组 answer ，其中 answer[i] 等于 nums 中除了 nums[i] 之外其余各元素的乘积 。 题目数据 保证 数组 nums 之中任意元素的全部前缀元素和后缀的乘积都在 32 位 整数范围内。 请 不要使用除法， 且在 O(n) 时间复杂度内完成此题。 示例 1: 示例 2: 提示： 2 <= nums.length <= 10 5 30 <= nums[i] <= 30 输入 保…", "description": "给你一个整数数组 nums，返回 数组 answer ，其中 answer[i] 等于 nums 中除了 nums[i] 之外其余各元素的乘积 。\n题目数据 保证 数组 nums之中任意元素的全部前缀元素和后缀的乘积都在  32 位 整数范围内。\n请 不要使用除法，且在 O(n) 时间复杂度内完成此题。\n示例 1:\n输入: nums = [1,2,3,4]\n输出: [24,12,8,6]\n示例 2:\n输入: nums = [-1,1,0,-3,3]\n输出: [0,0,9,0,0]\n提示：\n• 2 <= nums.length <= 105\n• -30 <= nums[i] <= 30\n• 输入 保证 数组 answer[i] 在  32 位 整数范围内\n进阶：你可以在 O(1) 的额外空间复杂度内完成这个题目吗？（ 出于对空间复杂度分析的目的，输出数组 不被视为 额外空间。）", "idea": "方法一：两次遍历 我们定义两个变量 \\textit{left} 和 \\textit{right}，分别表示当前元素左边所有元素的乘积和右边所有元素的乘积。初始时 \\textit{left}=1, \\textit{right}=1。定义一个长度为 n 的答案数组 \\textit{ans}。 我们先从左到右遍历数组，对于遍历到的第 i 个元素，我们用 \\textit{left} 更新 \\textit{ans}[i]，然后 \\textit{left} 乘以 \\textit{nums}[i]。 然后，我们从右到左遍历数组，对于遍历到的第 i 个元素，我们更新 \\textit{ans}[i] 为 \\textit{ans}[i] \\times \\textit{right}，然后 \\textit{right} 乘以 \\textit{nums}[i]。 遍历结束后，返回答案数组 \\textit{ans}。 时间复杂度 O(n)，其中 n 是数组 \\textit{nums} 的长度。忽略答案数组的空间消耗，空间复杂度 O(1)。", "tags": ["数组", "前缀和"], "url": "https://leetcode.cn/problems/product-of-array-except-self/", "go": "func productExceptSelf(nums []int) []int {\n\tn := len(nums)\n\tans := make([]int, n)\n\tleft, right := 1, 1\n\tfor i, x := range nums {\n\t\tans[i] = left\n\t\tleft *= x\n\t}\n\tfor i := n - 1; i >= 0; i-- {\n\t\tans[i] *= right\n\t\tright *= nums[i]\n\t}\n\treturn ans\n}", "java": "class Solution {\n    public int[] productExceptSelf(int[] nums) {\n        int n = nums.length;\n        int[] ans = new int[n];\n        for (int i = 0, left = 1; i < n; ++i) {\n            ans[i] = left;\n            left *= nums[i];\n        }\n        for (int i = n - 1, right = 1; i >= 0; --i) {\n            ans[i] *= right;\n            right *= nums[i];\n        }\n        return ans;\n    }\n}"}, {"id": 125, "title": "验证回文串", "enTitle": "Valid Palindrome", "category": "双指针", "difficulty": "简单", "summary": "如果在将所有大写字符转换为小写字符、并移除所有非字母数字字符之后，短语正着读和反着读都一样。则可以认为该短语是一个 回文串 。 字母和数字都属于字母数字字符。 给你一个字符串 s ，如果它是 回文串 ，返回 true ；否则，返回 false 。 示例 1： 示例 2： 示例 3： 提示： 1 <= s.length <= 2 10 5 s 仅由可打印的 ASCII 字符组成", "description": "如果在将所有大写字符转换为小写字符、并移除所有非字母数字字符之后，短语正着读和反着读都一样。则可以认为该短语是一个 回文串 。\n字母和数字都属于字母数字字符。\n给你一个字符串 s，如果它是 回文串 ，返回 true ；否则，返回 false 。\n示例 1：\n输入: s = \"A man, a plan, a canal: Panama\"\n输出：true\n解释：\"amanaplanacanalpanama\" 是回文串。\n示例 2：\n输入：s = \"race a car\"\n输出：false\n解释：\"raceacar\" 不是回文串。\n示例 3：\n输入：s = \" \"\n输出：true\n解释：在移除非字母数字字符之后，s 是一个空字符串 \"\" 。\n由于空字符串正着反着读都一样，所以是回文串。\n提示：\n• 1 <= s.length <= 2 * 105\n• s 仅由可打印的 ASCII 字符组成", "idea": "方法一：双指针 我们用双指针 i 和 j 分别指向字符串 s 的两端，接下来循环以下过程，直至 i \\geq j： 1. 如果 s[i] 不是字母或数字，指针 i 右移一位，继续下一次循环； 1. 如果 s[j] 不是字母或数字，指针 j 左移一位，继续下一次循环； 1. 如果 s[i] 和 s[j] 的小写形式不相等，返回 false； 1. 否则，指针 i 右移一位，指针 j 左移一位，继续下一次循环。 循环结束，返回 true。 时间复杂度 O(n)，其中 n 是字符串 s 的长度。空间复杂度 O(1)。", "tags": ["双指针", "字符串"], "url": "https://leetcode.cn/problems/valid-palindrome/", "go": "func isPalindrome(s string) bool {\n\ti, j := 0, len(s)-1\n\tfor i < j {\n\t\tif !isalnum(s[i]) {\n\t\t\ti++\n\t\t} else if !isalnum(s[j]) {\n\t\t\tj--\n\t\t} else if tolower(s[i]) != tolower(s[j]) {\n\t\t\treturn false\n\t\t} else {\n\t\t\ti, j = i+1, j-1\n\t\t}\n\t}\n\treturn true\n}\n\nfunc isalnum(ch byte) bool {\n\treturn (ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z') || (ch >= '0' && ch <= '9')\n}\n\nfunc tolower(ch byte) byte {\n\tif ch >= 'A' && ch <= 'Z' {\n\t\treturn ch + 32\n\t}\n\treturn ch\n}", "java": "class Solution {\n    public boolean isPalindrome(String s) {\n        int i = 0, j = s.length() - 1;\n        while (i < j) {\n            if (!Character.isLetterOrDigit(s.charAt(i))) {\n                ++i;\n            } else if (!Character.isLetterOrDigit(s.charAt(j))) {\n                --j;\n            } else if (Character.toLowerCase(s.charAt(i)) != Character.toLowerCase(s.charAt(j))) {\n                return false;\n            } else {\n                ++i;\n                --j;\n            }\n        }\n        return true;\n    }\n}"}, {"id": 167, "title": "两数之和 II - 输入有序数组", "enTitle": "Two Sum II Input Array Is Sorted", "category": "双指针", "difficulty": "中等", "summary": "给你一个下标从 1 开始的整数数组 numbers ，该数组已按 非递减顺序排列 ，请你从数组中找出满足相加之和等于目标数 target 的两个数。如果设这两个数分别是 numbers[index 1 ] 和 numbers[index 2 ] ，则 1 <= index 1 < index 2 <= numbers.length 。 以长度为 2 的整数数组 [index 1 , index 2 ] 的形式返回这两个整数的下标 ind…", "description": "给你一个下标从 1 开始的整数数组 numbers ，该数组已按 非递减顺序排列  ，请你从数组中找出满足相加之和等于目标数 target 的两个数。如果设这两个数分别是 numbers[index1] 和 numbers[index2] ，则 1 <= index1 < index2 <= numbers.length 。\n以长度为 2 的整数数组 [index1, index2] 的形式返回这两个整数的下标 index1 和 index2。\n你可以假设每个输入 只对应唯一的答案 ，而且你 不可以 重复使用相同的元素。\n你所设计的解决方案必须只使用常量级的额外空间。\n示例 1：\n输入：numbers = [2,7,11,15], target = 9\n输出：[1,2]\n解释：2 与 7 之和等于目标数 9 。因此 index1 = 1, index2 = 2 。返回 [1, 2] 。\n示例 2：\n输入：numbers = [2,3,4], target = 6\n输出：[1,3]\n解释：2 与 4 之和等于目标数 6 。因此 index1 = 1, index2 = 3 。返回 [1, 3] 。\n示例 3：\n输入：numbers = [-1,0], target = -1\n输出：[1,2]\n解释：-1 与 0 之和等于目标数 -1 。因此 index1 = 1, index2 = 2 。返回 [1, 2] 。\n提示：\n• 2 <= numbers.length <= 3 * 104\n• -1000 <= numbers[i] <= 1000\n• numbers 按 非递减顺序 排列\n• -1000 <= target <= 1000\n• 仅存在一个有效答案", "idea": "方法一：二分查找 我们注意到数组按照非递减顺序排列，因此对于每个 numbers[i]，可以通过二分查找的方式找到 target numbers[i] 的位置，如果存在，那么返回 [i + 1, j + 1] 即可。 时间复杂度 O(n \\times \\log n)，其中 n 为数组 numbers 的长度。空间复杂度 O(1)。", "tags": ["数组", "双指针", "二分查找"], "url": "https://leetcode.cn/problems/two-sum-ii-input-array-is-sorted/", "go": "func twoSum(numbers []int, target int) []int {\n\tfor i, n := 0, len(numbers); ; i++ {\n\t\tx := target - numbers[i]\n\t\tj := sort.SearchInts(numbers[i+1:], x) + i + 1\n\t\tif j < n && numbers[j] == x {\n\t\t\treturn []int{i + 1, j + 1}\n\t\t}\n\t}\n}", "java": "class Solution {\n    public int[] twoSum(int[] numbers, int target) {\n        for (int i = 0, n = numbers.length;; ++i) {\n            int x = target - numbers[i];\n            int l = i + 1, r = n - 1;\n            while (l < r) {\n                int mid = (l + r) >> 1;\n                if (numbers[mid] >= x) {\n                    r = mid;\n                } else {\n                    l = mid + 1;\n                }\n            }\n            if (numbers[l] == x) {\n                return new int[] {i + 1, l + 1};\n            }\n        }\n    }\n}"}, {"id": 15, "title": "三数之和", "enTitle": "3Sum", "category": "双指针", "difficulty": "中等", "summary": "给你一个整数数组 nums ，判断是否存在三元组 [nums[i], nums[j], nums[k]] 满足 i != j 、 i != k 且 j != k ，同时还满足 nums[i] + nums[j] + nums[k] == 0 。请你返回所有和为 0 且不重复的三元组。 注意： 答案中不可以包含重复的三元组。 示例 1： 示例 2： 示例 3： 提示： 3 <= nums.length <= 3000 10 5 <= nu…", "description": "给你一个整数数组 nums ，判断是否存在三元组 [nums[i], nums[j], nums[k]] 满足 i != j、i != k 且 j != k ，同时还满足 nums[i] + nums[j] + nums[k] == 0 。请你返回所有和为 0 且不重复的三元组。\n注意：答案中不可以包含重复的三元组。\n示例 1：\n输入：nums = [-1,0,1,2,-1,-4]\n输出：[[-1,-1,2],[-1,0,1]]\n解释：\nnums[0] + nums[1] + nums[2] = (-1) + 0 + 1 = 0 。\nnums[1] + nums[2] + nums[4] = 0 + 1 + (-1) = 0 。\nnums[0] + nums[3] + nums[4] = (-1) + 2 + (-1) = 0 。\n不同的三元组是 [-1,0,1] 和 [-1,-1,2] 。\n注意，输出的顺序和三元组的顺序并不重要。\n示例 2：\n输入：nums = [0,1,1]\n输出：[]\n解释：唯一可能的三元组和不为 0 。\n示例 3：\n输入：nums = [0,0,0]\n输出：[[0,0,0]]\n解释：唯一可能的三元组和为 0 。\n提示：\n• 3 <= nums.length <= 3000\n• -105 <= nums[i] <= 105", "idea": "方法一：排序 + 双指针 我们注意到，题目不要求我们按照顺序返回三元组，因此我们不妨先对数组进行排序，这样就可以方便地跳过重复的元素。 接下来，我们枚举三元组的第一个元素 nums[i]，其中 0 \\leq i \\lt n 2。对于每个 i，我们可以通过维护两个指针 j = i + 1 和 k = n 1，从而找到满足 nums[i] + nums[j] + nums[k] = 0 的 j 和 k。在枚举的过程中，我们需要跳过重复的元素，以避免出现重复的三元组。 具体判断逻辑如下： 如果 i \\gt 0 并且 nums[i] = nums[i 1]，则说明当前枚举的元素与上一个元素相同，我们可以直接跳过，因为不会产生新的结果。 如果 nums[i] \\gt 0，则说明当前枚举的元素大于 0，则三数之和必然无法等于 0，结束枚举。 否则，我们令左指针 j = i + 1，右指针 k = n 1，当 j \\lt k 时，执行循环，计算三数之和 x = nums[i] + nums[j] + nums[k]，并与 0 比较： 如果 x \\lt 0，则说明 nums[j] 太小，我们需要将 j 右移一位。 如果 x \\gt 0，则说…", "tags": ["数组", "双指针", "排序"], "url": "https://leetcode.cn/problems/3sum/", "go": "func threeSum(nums []int) (ans [][]int) {\n\tsort.Ints(nums)\n\tn := len(nums)\n\tfor i := 0; i < n-2 && nums[i] <= 0; i++ {\n\t\tif i > 0 && nums[i] == nums[i-1] {\n\t\t\tcontinue\n\t\t}\n\t\tj, k := i+1, n-1\n\t\tfor j < k {\n\t\t\tx := nums[i] + nums[j] + nums[k]\n\t\t\tif x < 0 {\n\t\t\t\tj++\n\t\t\t} else if x > 0 {\n\t\t\t\tk--\n\t\t\t} else {\n\t\t\t\tans = append(ans, []int{nums[i], nums[j], nums[k]})\n\t\t\t\tj, k = j+1, k-1\n\t\t\t\tfor j < k && nums[j] == nums[j-1] {\n\t\t\t\t\tj++\n\t\t\t\t}\n\t\t\t\tfor j < k && nums[k] == nums[k+1] {\n\t\t\t\t\tk--\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\treturn\n}", "java": "class Solution {\n    public List<List<Integer>> threeSum(int[] nums) {\n        Arrays.sort(nums);\n        List<List<Integer>> ans = new ArrayList<>();\n        int n = nums.length;\n        for (int i = 0; i < n - 2 && nums[i] <= 0; ++i) {\n            if (i > 0 && nums[i] == nums[i - 1]) {\n                continue;\n            }\n            int j = i + 1, k = n - 1;\n            while (j < k) {\n                int x = nums[i] + nums[j] + nums[k];\n                if (x < 0) {\n                    ++j;\n                } else if (x > 0) {\n                    --k;\n                } else {\n                    ans.add(List.of(nums[i], nums[j++], nums[k--]));\n                    while (j < k && nums[j] == nums[j - 1]) {\n                        ++j;\n                    }\n                    while (j < k && nums[k] == nums[k + 1]) {\n                        --k;\n                    }\n                }\n            }\n        }\n        return ans;\n    }\n}"}, {"id": 11, "title": "盛最多水的容器", "enTitle": "Container With Most Water", "category": "双指针", "difficulty": "中等", "summary": "给定一个长度为 n 的整数数组 height 。有 n 条垂线，第 i 条线的两个端点是 (i, 0) 和 (i, height[i]) 。 找出其中的两条线，使得它们与 x 轴共同构成的容器可以容纳最多的水。 返回容器可以储存的最大水量。 说明： 你不能倾斜容器。 示例 1： 示例 2： 提示： n == height.length 2 <= n <= 10 5 0 <= height[i] <= 10 4", "description": "给定一个长度为 n 的整数数组 height 。有 n 条垂线，第 i 条线的两个端点是 (i, 0) 和 (i, height[i]) 。\n找出其中的两条线，使得它们与 x 轴共同构成的容器可以容纳最多的水。\n返回容器可以储存的最大水量。\n说明：你不能倾斜容器。\n示例 1：\n输入：[1,8,6,2,5,4,8,3,7]\n输出：49\n解释：图中垂直线代表输入数组 [1,8,6,2,5,4,8,3,7]。在此情况下，容器能够容纳水（表示为蓝色部分）的最大值为 49。\n示例 2：\n输入：height = [1,1]\n输出：1\n提示：\n• n == height.length\n• 2 <= n <= 105\n• 0 <= height[i] <= 104", "idea": "方法一：双指针 我们使用两个指针 l 和 r 分别指向数组的左右两端，即 l = 0，而 r = n 1，其中 n 是数组的长度。 接下来，我们使用变量 \\textit{ans} 记录容器的最大容量，初始化为 0。 然后，我们开始进行循环，每次循环中，我们计算当前容器的容量，即 \\textit{min}(height[l], height[r]) \\times (r l)，并将其与 \\textit{ans} 进行比较，将较大值赋给 \\textit{ans}。然后，我们判断 height[l] 和 height[r] 的大小，如果 \\textit{height}[l] < \\textit{height}[r]，移动 r 指针不会使得结果变得更好，因为容器的高度由较短的那根垂直线决定，所以我们移动 l 指针。反之，我们移动 r 指针。 遍历结束后，返回 \\textit{ans} 即可。 时间复杂度 O(n)，其中 n 是数组 \\textit{height} 的长度。空间复杂度 O(1)。", "tags": ["贪心", "数组", "双指针"], "url": "https://leetcode.cn/problems/container-with-most-water/", "go": "func maxArea(height []int) (ans int) {\n\tl, r := 0, len(height)-1\n\tfor l < r {\n\t\tt := min(height[l], height[r]) * (r - l)\n\t\tans = max(ans, t)\n\t\tif height[l] < height[r] {\n\t\t\tl++\n\t\t} else {\n\t\t\tr--\n\t\t}\n\t}\n\treturn\n}", "java": "class Solution {\n    public int maxArea(int[] height) {\n        int l = 0, r = height.length - 1;\n        int ans = 0;\n        while (l < r) {\n            int t = Math.min(height[l], height[r]) * (r - l);\n            ans = Math.max(ans, t);\n            if (height[l] < height[r]) {\n                ++l;\n            } else {\n                --r;\n            }\n        }\n        return ans;\n    }\n}"}, {"id": 42, "title": "接雨水", "enTitle": "Trapping Rain Water", "category": "双指针", "difficulty": "困难", "summary": "给定 n 个非负整数表示每个宽度为 1 的柱子的高度图，计算按此排列的柱子，下雨之后能接多少雨水。 示例 1： 示例 2： 提示： n == height.length 1 <= n <= 2 10 4 0 <= height[i] <= 10 5", "description": "给定 n 个非负整数表示每个宽度为 1 的柱子的高度图，计算按此排列的柱子，下雨之后能接多少雨水。\n示例 1：\n输入：height = [0,1,0,2,1,0,1,3,2,1,2,1]\n输出：6\n解释：上面是由数组 [0,1,0,2,1,0,1,3,2,1,2,1] 表示的高度图，在这种情况下，可以接 6 个单位的雨水（蓝色部分表示雨水）。\n示例 2：\n输入：height = [4,2,0,3,2,5]\n输出：9\n提示：\n• n == height.length\n• 1 <= n <= 2 * 104\n• 0 <= height[i] <= 105", "idea": "方法一：动态规划 我们定义 left[i] 表示下标 i 位置及其左边的最高柱子的高度，定义 right[i] 表示下标 i 位置及其右边的最高柱子的高度。那么下标 i 位置能接的雨水量为 \\min(left[i], right[i]) height[i]。我们遍历数组，计算出 left[i] 和 right[i]，最后答案为 \\sum{i=0}^{n1} \\min(left[i], right[i]) height[i]。 时间复杂度 O(n)，空间复杂度 O(n)。其中 n 为数组的长度。", "tags": ["栈", "数组", "双指针", "动态规划"], "url": "https://leetcode.cn/problems/trapping-rain-water/", "go": "func trap(height []int) (ans int) {\n\tn := len(height)\n\tleft := make([]int, n)\n\tright := make([]int, n)\n\tleft[0], right[n-1] = height[0], height[n-1]\n\tfor i := 1; i < n; i++ {\n\t\tleft[i] = max(left[i-1], height[i])\n\t\tright[n-i-1] = max(right[n-i], height[n-i-1])\n\t}\n\tfor i, h := range height {\n\t\tans += min(left[i], right[i]) - h\n\t}\n\treturn\n}", "java": "class Solution {\n    public int trap(int[] height) {\n        int n = height.length;\n        int[] left = new int[n];\n        int[] right = new int[n];\n        left[0] = height[0];\n        right[n - 1] = height[n - 1];\n        for (int i = 1; i < n; ++i) {\n            left[i] = Math.max(left[i - 1], height[i]);\n            right[n - i - 1] = Math.max(right[n - i], height[n - i - 1]);\n        }\n        int ans = 0;\n        for (int i = 0; i < n; ++i) {\n            ans += Math.min(left[i], right[i]) - height[i];\n        }\n        return ans;\n    }\n}"}, {"id": 121, "title": "买卖股票的最佳时机", "enTitle": "Best Time to Buy And Sell Stock", "category": "滑动窗口", "difficulty": "简单", "summary": "给定一个数组 prices ，它的第 i 个元素 prices[i] 表示一支给定股票第 i 天的价格。 你只能选择 某一天 买入这只股票，并选择在 未来的某一个不同的日子 卖出该股票。设计一个算法来计算你所能获取的最大利润。 返回你可以从这笔交易中获取的最大利润。如果你不能获取任何利润，返回 0 。 示例 1： 示例 2： 提示： 1 5 0 4", "description": "给定一个数组 prices ，它的第 i 个元素 prices[i] 表示一支给定股票第 i 天的价格。\n你只能选择 某一天 买入这只股票，并选择在 未来的某一个不同的日子 卖出该股票。设计一个算法来计算你所能获取的最大利润。\n返回你可以从这笔交易中获取的最大利润。如果你不能获取任何利润，返回 0 。\n示例 1：\n输入：[7,1,5,3,6,4]\n输出：5\n解释：在第 2 天（股票价格 = 1）的时候买入，在第 5 天（股票价格 = 6）的时候卖出，最大利润 = 6-1 = 5 。\n注意利润不能是 7-1 = 6, 因为卖出价格需要大于买入价格；同时，你不能在买入前卖出股票。\n示例 2：\n输入：prices = [7,6,4,3,1]\n输出：0\n解释：在这种情况下, 没有交易完成, 所以最大利润为 0。\n提示：\n• 1 5\n• 0 4", "idea": "方法一：枚举 + 维护前缀最小值 我们可以枚举数组 nums 每个元素作为卖出价格，那么我们需要在前面找到一个最小值作为买入价格，这样才能使得利润最大化。 因此，我们用一个变量 mi 维护数组 nums 的前缀最小值。接下来遍历数组 nums，对于每个元素 v，计算其与前面元素的最小值 mi 的差值，更新答案为差值的最大值。然后更新 mi = min(mi, v)。继续遍历数组 nums，直到遍历结束。 最后返回答案即可。 时间复杂度 O(n)，其中 n 是数组 nums 的长度。空间复杂度 O(1)。", "tags": ["数组", "动态规划"], "url": "https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/", "go": "func maxProfit(prices []int) (ans int) {\n\tmi := prices[0]\n\tfor _, v := range prices {\n\t\tans = max(ans, v-mi)\n\t\tmi = min(mi, v)\n\t}\n\treturn\n}", "java": "class Solution {\n    public int maxProfit(int[] prices) {\n        int ans = 0, mi = prices[0];\n        for (int v : prices) {\n            ans = Math.max(ans, v - mi);\n            mi = Math.min(mi, v);\n        }\n        return ans;\n    }\n}"}, {"id": 3, "title": "无重复字符的最长子串", "enTitle": "Longest Substring Without Repeating Characters", "category": "滑动窗口", "difficulty": "中等", "summary": "给定一个字符串 s ，请你找出其中不含有重复字符的 最长 子串 的长度。 示例 1: 示例 2: 示例 3: 提示： 0 <= s.length <= 10 5 s 由英文字母、数字、符号和空格组成", "description": "给定一个字符串 s ，请你找出其中不含有重复字符的 最长 子串 的长度。\n示例 1:\n输入: s = \"abcabcbb\"\n输出: 3\n解释: 因为无重复字符的最长子串是 \"abc\"，所以其长度为 3。注意 \"bca\" 和 \"cab\" 也是正确答案。\n示例 2:\n输入: s = \"bbbbb\"\n输出: 1\n解释: 因为无重复字符的最长子串是 \"b\"，所以其长度为 1。\n示例 3:\n输入: s = \"pwwkew\"\n输出: 3\n解释: 因为无重复字符的最长子串是 \"wke\"，所以其长度为 3。\n请注意，你的答案必须是 子串 的长度，\"pwke\" 是一个子序列，不是子串。\n提示：\n• 0 <= s.length <= 105\n• s 由英文字母、数字、符号和空格组成", "idea": "方法一：滑动窗口 我们可以用两个指针 l 和 r 维护一个滑动窗口，使其始终满足窗口内没有重复字符，初始时 l 和 r 都指向字符串的第一个字符。用一个哈希表或者长度为 128 的数组 \\textit{cnt} 来记录每个字符出现的次数，其中 \\textit{cnt}[c] 表示字符 c 出现的次数。 接下来，我们依次移动右指针 r，每次移动时，将 \\textit{cnt}[s[r]] 的值加 1，然后判断当前窗口 [l, r] 内 \\textit{cnt}[s[r]] 是否大于 1，如果大于 1，说明当前窗口内有重复字符，我们需要移动左指针 l，直到窗口内没有重复字符为止。然后，我们更新答案 \\textit{ans} = \\max(\\textit{ans}, r l + 1)。 最终，我们返回答案 \\textit{ans} 即可。 时间复杂度 O(n)，其中 n 为字符串的长度。空间复杂度 O(|\\Sigma|)，其中 \\Sigma 表示字符集，这里 \\Sigma 的大小为 128。", "tags": ["哈希表", "字符串", "滑动窗口"], "url": "https://leetcode.cn/problems/longest-substring-without-repeating-characters/", "go": "func lengthOfLongestSubstring(s string) (ans int) {\n\tcnt := [128]int{}\n\tl := 0\n\tfor r, c := range s {\n\t\tcnt[c]++\n\t\tfor cnt[c] > 1 {\n\t\t\tcnt[s[l]]--\n\t\t\tl++\n\t\t}\n\t\tans = max(ans, r-l+1)\n\t}\n\treturn\n}", "java": "class Solution {\n    public int lengthOfLongestSubstring(String s) {\n        int[] cnt = new int[128];\n        int ans = 0, n = s.length();\n        for (int l = 0, r = 0; r < n; ++r) {\n            char c = s.charAt(r);\n            ++cnt[c];\n            while (cnt[c] > 1) {\n                --cnt[s.charAt(l++)];\n            }\n            ans = Math.max(ans, r - l + 1);\n        }\n        return ans;\n    }\n}"}, {"id": 424, "title": "替换后的最长重复字符", "enTitle": "Longest Repeating Character Replacement", "category": "滑动窗口", "difficulty": "中等", "summary": "给你一个字符串 s 和一个整数 k 。你可以选择字符串中的任一字符，并将其更改为任何其他大写英文字符。该操作最多可执行 k 次。 在执行上述操作后，返回 包含相同字母的最长子字符串的长度。 示例 1： 示例 2： 提示： 1 <= s.length <= 10 5 s 仅由大写英文字母组成 0 <= k <= s.length", "description": "给你一个字符串 s 和一个整数 k 。你可以选择字符串中的任一字符，并将其更改为任何其他大写英文字符。该操作最多可执行 k 次。\n在执行上述操作后，返回 包含相同字母的最长子字符串的长度。\n示例 1：\n输入：s = \"ABAB\", k = 2\n输出：4\n解释：用两个'A'替换为两个'B',反之亦然。\n示例 2：\n输入：s = \"AABABBA\", k = 1\n输出：4\n解释：\n将中间的一个'A'替换为'B',字符串变为 \"AABBBBA\"。\n子串 \"BBBB\" 有最长重复字母, 答案为 4。\n可能存在其他的方法来得到同样的结果。\n提示：\n• 1 <= s.length <= 105\n• s 仅由大写英文字母组成\n• 0 <= k <= s.length", "idea": "方法一：双指针 我们使用一个哈希表 cnt 统计字符串中每个字符出现的次数，使用双指针 l 和 r 维护一个滑动窗口，使得窗口的大小减去出现次数最多的字符的次数，结果不超过 k。 我们遍历字符串，每次更新窗口的右边界 r，并更新窗口内的字符出现次数，同时更新出现过的字符的最大出现次数 mx。当窗口的大小减去 mx 大于 k 时，我们需要缩小窗口的左边界 l，同时更新窗口内的字符出现次数，直到窗口的大小减去 mx 不大于 k。 最后，答案为 n l，其中 n 为字符串的长度。 时间复杂度 O(n)，空间复杂度 O(|\\Sigma|)。其中 n 为字符串的长度，而 |\\Sigma| 为字符集的大小，本题中字符集为大写英文字母，所以 |\\Sigma| = 26。", "tags": ["哈希表", "字符串", "滑动窗口"], "url": "https://leetcode.cn/problems/longest-repeating-character-replacement/", "go": "func characterReplacement(s string, k int) int {\n\tcnt := [26]int{}\n\tl, mx := 0, 0\n\tfor r, c := range s {\n\t\tcnt[c-'A']++\n\t\tmx = max(mx, cnt[c-'A'])\n\t\tif r-l+1-mx > k {\n\t\t\tcnt[s[l]-'A']--\n\t\t\tl++\n\t\t}\n\t}\n\treturn len(s) - l\n}", "java": "class Solution {\n    public int characterReplacement(String s, int k) {\n        int[] cnt = new int[26];\n        int l = 0, mx = 0;\n        int n = s.length();\n        for (int r = 0; r < n; ++r) {\n            mx = Math.max(mx, ++cnt[s.charAt(r) - 'A']);\n            if (r - l + 1 - mx > k) {\n                --cnt[s.charAt(l++) - 'A'];\n            }\n        }\n        return n - l;\n    }\n}"}, {"id": 567, "title": "字符串的排列", "enTitle": "Permutation In String", "category": "滑动窗口", "difficulty": "中等", "summary": "给你两个字符串 s1 和 s2 ，写一个函数来判断 s2 是否包含 s1 的 排列 。如果是，返回 true ；否则，返回 false 。 换句话说， s1 的排列之一是 s2 的 子串 。 示例 1： 示例 2： 提示： 1 <= s1.length, s2.length <= 10 4 s1 和 s2 仅包含小写字母", "description": "给你两个字符串 s1 和 s2 ，写一个函数来判断 s2 是否包含 s1 的 排列。如果是，返回 true ；否则，返回 false 。\n换句话说，s1 的排列之一是 s2 的 子串 。\n示例 1：\n输入：s1 = \"ab\" s2 = \"eidbaooo\"\n输出：true\n解释：s2 包含 s1 的排列之一 (\"ba\").\n示例 2：\n输入：s1= \"ab\" s2 = \"eidboaoo\"\n输出：false\n提示：\n• 1 <= s1.length, s2.length <= 104\n• s1 和 s2 仅包含小写字母", "idea": "方法一：滑动窗口 我们用一个数组 \\textit{cnt} 记录当前需要匹配的字符及其个数，用一个变量 \\textit{need} 记录当前还需要匹配的字符种类数，初始时 \\textit{cnt} 为字符串 \\textit{s1} 中各字符出现次数，而 \\textit{need} 为 \\textit{s1} 中不同字符的个数。 然后我们遍历字符串 \\textit{s2}，对于每个字符，我们将其在 \\textit{cnt} 中的对应值减一，如果减一后的值等于 0，说明当前字符在 \\textit{s1} 中出现次数已经满足要求，我们将 \\textit{need} 减一。如果当前下标 i 大于等于 \\textit{s1} 的长度，我们需要将 \\textit{s2}[i\\textit{s1}]\\textit{cnt} 中对应值加一，如果加一后的值等于 1，说明当前字符在 \\textit{s1} 中出现次数不再满足要求，我们将 \\textit{need} 加一。在遍历过程中，如果 \\textit{need} 的值等于 0，说明所有字符的出现次数都满足要求，我们就找到了一个满足要求的子串，返回 \\text{true}。 否则，如果遍历结…", "tags": ["哈希表", "双指针", "字符串", "滑动窗口"], "url": "https://leetcode.cn/problems/permutation-in-string/", "go": "func checkInclusion(s1 string, s2 string) bool {\n\tneed := 0\n\tcnt := [26]int{}\n\n\tfor _, c := range s1 {\n\t\tif cnt[c-'a']++; cnt[c-'a'] == 1 {\n\t\t\tneed++\n\t\t}\n\t}\n\n\tm, n := len(s1), len(s2)\n\tfor i := 0; i < n; i++ {\n\t\tc := s2[i] - 'a'\n\t\tif cnt[c]--; cnt[c] == 0 {\n\t\t\tneed--\n\t\t}\n\t\tif i >= m {\n\t\t\tc = s2[i-m] - 'a'\n\t\t\tif cnt[c]++; cnt[c] == 1 {\n\t\t\t\tneed++\n\t\t\t}\n\t\t}\n\t\tif need == 0 {\n\t\t\treturn true\n\t\t}\n\t}\n\treturn false\n}", "java": "class Solution {\n    public boolean checkInclusion(String s1, String s2) {\n        int need = 0;\n        int[] cnt = new int[26];\n        for (char c : s1.toCharArray()) {\n            if (++cnt[c - 'a'] == 1) {\n                ++need;\n            }\n        }\n        int m = s1.length(), n = s2.length();\n        for (int i = 0; i < n; ++i) {\n            int c = s2.charAt(i) - 'a';\n            if (--cnt[c] == 0) {\n                --need;\n            }\n            if (i >= m) {\n                c = s2.charAt(i - m) - 'a';\n                if (++cnt[c] == 1) {\n                    ++need;\n                }\n            }\n            if (need == 0) {\n                return true;\n            }\n        }\n        return false;\n    }\n}"}, {"id": 76, "title": "最小覆盖子串", "enTitle": "Minimum Window Substring", "category": "滑动窗口", "difficulty": "困难", "summary": "给定两个字符串 s 和 t ，长度分别是 m 和 n ，返回 s 中的 最短窗口 子串 ，使得该子串包含 t 中的每一个字符（ 包括重复字符 ）。如果没有这样的子串，返回空字符串 \"\" 。 测试用例保证答案唯一。 示例 1： 示例 2： 示例 3: 提示： m == s.length n == t.length 1 <= m, n <= 10 5 s 和 t 由英文字母组成 进阶： 你能设计一个在 O(m + n) 时间内解决此问题的算…", "description": "给定两个字符串 s 和 t，长度分别是 m 和 n，返回 s 中的 最短窗口 子串，使得该子串包含 t 中的每一个字符（包括重复字符）。如果没有这样的子串，返回空字符串 \"\"。\n测试用例保证答案唯一。\n示例 1：\n输入：s = \"ADOBECODEBANC\", t = \"ABC\"\n输出：\"BANC\"\n解释：最小覆盖子串 \"BANC\" 包含来自字符串 t 的 'A'、'B' 和 'C'。\n示例 2：\n输入：s = \"a\", t = \"a\"\n输出：\"a\"\n解释：整个字符串 s 是最小覆盖子串。\n示例 3:\n输入: s = \"a\", t = \"aa\"\n输出: \"\"\n解释: t 中两个字符 'a' 均应包含在 s 的子串中，\n因此没有符合条件的子字符串，返回空字符串。\n提示：\n• m == s.length\n• n == t.length\n• 1 <= m, n <= 105\n• s 和 t 由英文字母组成\n进阶：你能设计一个在 O(m + n) 时间内解决此问题的算法吗？", "idea": "方法一：计数 + 双指针 我们用一个哈希表或数组 \\textit{need} 统计字符串 t 中每个字符出现的次数，用另一个哈希表或数组 \\textit{window} 统计滑动窗口中每个字符出现的次数。另外，定义两个指针 l 和 r 分别指向窗口的左右边界，变量 \\textit{cnt} 表示窗口中已经包含了 t 中的多少个字符，变量 k 和 \\textit{mi} 分别表示最小覆盖子串的起始位置和长度。 我们从左到右遍历字符串 s，对于当前遍历到的字符 s[r]： 我们将其加入窗口中，即 \\textit{window}[s[r]] = \\textit{window}[s[r]] + 1，如果此时 \\textit{need}[s[r]] \\geq \\textit{window}[s[r]]，则说明 s[r] 是一个「必要的字符」，我们将 \\textit{cnt} 加一。 如果 \\textit{cnt} 等于 t 的长度，说明此时窗口中已经包含了 t 中的所有字符，我们就可以尝试更新最小覆盖子串的起始位置和长度了。如果 r l + 1 < \\textit{mi}，说明当前窗口表示的子串更短，我们就更新 \\textit{mi}…", "tags": ["哈希表", "字符串", "滑动窗口"], "url": "https://leetcode.cn/problems/minimum-window-substring/", "go": "func minWindow(s string, t string) string {\n\tneed := make([]int, 128)\n\twindow := make([]int, 128)\n\tfor i := 0; i < len(t); i++ {\n\t\tneed[t[i]]++\n\t}\n\n\tm, n := len(s), len(t)\n\tk, mi, cnt := -1, m+1, 0\n\n\tfor l, r := 0, 0; r < m; r++ {\n\t\tc := s[r]\n\t\tif window[c]++; window[c] <= need[c] {\n\t\t\tcnt++\n\t\t}\n\t\tfor cnt == n {\n\t\t\tif r-l+1 < mi {\n\t\t\t\tmi = r - l + 1\n\t\t\t\tk = l\n\t\t\t}\n\n\t\t\tc = s[l]\n\t\t\tif window[c] <= need[c] {\n\t\t\t\tcnt--\n\t\t\t}\n\t\t\twindow[c]--\n\t\t\tl++\n\t\t}\n\t}\n\tif k < 0 {\n\t\treturn \"\"\n\t}\n\treturn s[k : k+mi]\n}", "java": "class Solution {\n    public String minWindow(String s, String t) {\n        int[] need = new int[128];\n        int[] window = new int[128];\n        for (char c : t.toCharArray()) {\n            ++need[c];\n        }\n        int m = s.length(), n = t.length();\n        int k = -1, mi = m + 1, cnt = 0;\n        for (int l = 0, r = 0; r < m; ++r) {\n            char c = s.charAt(r);\n            if (++window[c] <= need[c]) {\n                ++cnt;\n            }\n            while (cnt == n) {\n                if (r - l + 1 < mi) {\n                    mi = r - l + 1;\n                    k = l;\n                }\n                c = s.charAt(l);\n                if (window[c] <= need[c]) {\n                    --cnt;\n                }\n                --window[c];\n                ++l;\n            }\n        }\n        return k < 0 ? \"\" : s.substring(k, k + mi);\n    }\n}"}, {"id": 239, "title": "滑动窗口最大值", "enTitle": "Sliding Window Maximum", "category": "滑动窗口", "difficulty": "困难", "summary": "给你一个整数数组 nums ，有一个大小为 k 的滑动窗口从数组的最左侧移动到数组的最右侧。你只可以看到在滑动窗口内的 k 个数字。滑动窗口每次只向右移动一位。 返回 滑动窗口中的最大值 。 示例 1： 示例 2： 提示： 1 <= nums.length <= 10 5 10 4 <= nums[i] <= 10 4 1 <= k <= nums.length", "description": "给你一个整数数组 nums，有一个大小为 k 的滑动窗口从数组的最左侧移动到数组的最右侧。你只可以看到在滑动窗口内的 k 个数字。滑动窗口每次只向右移动一位。\n返回 滑动窗口中的最大值 。\n示例 1：\n输入：nums = [1,3,-1,-3,5,3,6,7], k = 3\n输出：[3,3,5,5,6,7]\n解释：\n滑动窗口的位置 最大值\n--------------- -----\n[1 3 -1] -3 5 3 6 7 3\n1 [3 -1 -3] 5 3 6 7 3\n1 3 [-1 -3 5] 3 6 7 5\n1 3 -1 [-3 5 3] 6 7 5\n1 3 -1 -3 [5 3 6] 7 6\n1 3 -1 -3 5 [3 6 7] 7\n示例 2：\n输入：nums = [1], k = 1\n输出：[1]\n提示：\n• 1 <= nums.length <= 105\n• -104 <= nums[i] <= 104\n• 1 <= k <= nums.length", "idea": "方法一：优先队列（大根堆） 我们可以使用优先队列（大根堆）来维护滑动窗口中的最大值。 先将前 k1 个元素加入优先队列，接下来从第 k 个元素开始，将新元素加入优先队列，同时判断堆顶元素是否滑出窗口，如果滑出窗口则将堆顶元素弹出。然后我们将堆顶元素加入结果数组。 时间复杂度 O(n \\times \\log k)，空间复杂度 O(k)。其中 n 为数组长度。", "tags": ["队列", "数组", "滑动窗口", "单调队列"], "url": "https://leetcode.cn/problems/sliding-window-maximum/", "go": "func maxSlidingWindow(nums []int, k int) (ans []int) {\n\tq := hp{}\n\tfor i, v := range nums[:k-1] {\n\t\theap.Push(&q, pair{v, i})\n\t}\n\tfor i := k - 1; i < len(nums); i++ {\n\t\theap.Push(&q, pair{nums[i], i})\n\t\tfor q[0].i <= i-k {\n\t\t\theap.Pop(&q)\n\t\t}\n\t\tans = append(ans, q[0].v)\n\t}\n\treturn\n}\n\ntype pair struct{ v, i int }\n\ntype hp []pair\n\nfunc (h hp) Len() int { return len(h) }\nfunc (h hp) Less(i, j int) bool {\n\ta, b := h[i], h[j]\n\treturn a.v > b.v || (a.v == b.v && i < j)\n}\nfunc (h hp) Swap(i, j int) { h[i], h[j] = h[j], h[i] }\nfunc (h *hp) Push(v any)   { *h = append(*h, v.(pair)) }\nfunc (h *hp) Pop() any     { a := *h; v := a[len(a)-1]; *h = a[:len(a)-1]; return v }", "java": "class Solution {\n    public int[] maxSlidingWindow(int[] nums, int k) {\n        PriorityQueue<int[]> q\n            = new PriorityQueue<>((a, b) -> a[0] == b[0] ? a[1] - b[1] : b[0] - a[0]);\n        int n = nums.length;\n        for (int i = 0; i < k - 1; ++i) {\n            q.offer(new int[] {nums[i], i});\n        }\n        int[] ans = new int[n - k + 1];\n        for (int i = k - 1, j = 0; i < n; ++i) {\n            q.offer(new int[] {nums[i], i});\n            while (q.peek()[1] <= i - k) {\n                q.poll();\n            }\n            ans[j++] = q.peek()[0];\n        }\n        return ans;\n    }\n}"}, {"id": 20, "title": "有效的括号", "enTitle": "Valid Parentheses", "category": "栈", "difficulty": "简单", "summary": "给定一个只包括 '(' ， ')' ， '{' ， '}' ， '[' ， ']' 的字符串 s ，判断字符串是否有效。 有效字符串需满足： 左括号必须用相同类型的右括号闭合。 左括号必须以正确的顺序闭合。 每个右括号都有一个对应的相同类型的左括号。 示例 1： 输入： s = \"()\" 输出： true 示例 2： 输入： s = \"()[]{}\" 输出： true 示例 3： 输入： s = \"(]\" 输出： false 示例 4：…", "description": "给定一个只包括 '('，')'，'{'，'}'，'['，']' 的字符串 s ，判断字符串是否有效。\n有效字符串需满足：\n• 左括号必须用相同类型的右括号闭合。\n• 左括号必须以正确的顺序闭合。\n• 每个右括号都有一个对应的相同类型的左括号。\n示例 1：\n输入：s = \"()\"\n输出：true\n示例 2：\n输入：s = \"()[]{}\"\n输出：true\n示例 3：\n输入：s = \"(]\"\n输出：false\n示例 4：\n输入：s = \"([])\"\n输出：true\n示例 5：\n输入：s = \"([)]\"\n输出：false\n提示：\n• 1 <= s.length <= 104\n• s 仅由括号 '()[]{}' 组成", "idea": "方法一：栈 遍历括号字符串 s，遇到左括号时，压入当前的左括号；遇到右括号时，弹出栈顶元素（若栈为空，直接返回 false），判断是否匹配，若不匹配，直接返回 false。 也可以选择遇到左括号时，将右括号压入栈中；遇到右括号时，弹出栈顶元素（若栈为空，直接返回 false），判断是否是相等。若不匹配，直接返回 false。 两者的区别仅限于括号转换时机，一个是在入栈时，一个是在出栈时。 遍历结束，若栈为空，说明括号字符串有效，返回 true；否则，返回 false。 时间复杂度 O(n)，空间复杂度 O(n)。其中 n 为括号字符串 s 的长度。", "tags": ["栈", "字符串"], "url": "https://leetcode.cn/problems/valid-parentheses/", "go": "func isValid(s string) bool {\n\tstk := []rune{}\n\tfor _, c := range s {\n\t\tif c == '(' || c == '{' || c == '[' {\n\t\t\tstk = append(stk, c)\n\t\t} else if len(stk) == 0 || !match(stk[len(stk)-1], c) {\n\t\t\treturn false\n\t\t} else {\n\t\t\tstk = stk[:len(stk)-1]\n\t\t}\n\t}\n\treturn len(stk) == 0\n}\n\nfunc match(l, r rune) bool {\n\treturn (l == '(' && r == ')') || (l == '[' && r == ']') || (l == '{' && r == '}')\n}", "java": "class Solution {\n    public boolean isValid(String s) {\n        Deque<Character> stk = new ArrayDeque<>();\n        for (char c : s.toCharArray()) {\n            if (c == '(' || c == '{' || c == '[') {\n                stk.push(c);\n            } else if (stk.isEmpty() || !match(stk.pop(), c)) {\n                return false;\n            }\n        }\n        return stk.isEmpty();\n    }\n\n    private boolean match(char l, char r) {\n        return (l == '(' && r == ')') || (l == '{' && r == '}') || (l == '[' && r == ']');\n    }\n}"}, {"id": 155, "title": "最小栈", "enTitle": "Min Stack", "category": "栈", "difficulty": "中等", "summary": "设计一个支持 push ， pop ， top 操作，并能在常数时间内检索到最小元素的栈。 实现 MinStack 类: MinStack() 初始化堆栈对象。 void push(int value) 将元素 value 推入堆栈。 void pop() 删除堆栈顶部的元素。 int top() 获取堆栈顶部的元素。 int getMin() 获取堆栈中的最小元素。 示例 1: 提示： 2 31 <= val <= 2 31 1 po…", "description": "设计一个支持 push ，pop ，top 操作，并能在常数时间内检索到最小元素的栈。\n实现 MinStack 类:\n• MinStack() 初始化堆栈对象。\n• void push(int value) 将元素 value 推入堆栈。\n• void pop() 删除堆栈顶部的元素。\n• int top() 获取堆栈顶部的元素。\n• int getMin() 获取堆栈中的最小元素。\n示例 1:\n输入：\n[\"MinStack\",\"push\",\"push\",\"push\",\"getMin\",\"pop\",\"top\",\"getMin\"]\n[[],[-2],[0],[-3],[],[],[],[]]\n输出：\n[null,null,null,null,-3,null,0,-2]\n解释：\nMinStack minStack = new MinStack();\nminStack.push(-2);\nminStack.push(0);\nminStack.push(-3);\nminStack.getMin(); --> 返回 -3.\nminStack.pop();\nminStack.top(); --> 返回 0.\nminStack.getMin(); --> 返回 -2.\n提示：\n• -231 <= val <= 231 - 1\n• pop、top 和 getMin 操作总是在 非空栈 上调用\n• push, pop, top, and getMin最多被调用 3 * 104 次", "idea": "方法一：双栈 我们用两个栈来实现，其中 stk1 用来存储数据，stk2 用来存储当前栈中的最小值。初始时，stk2 中存储一个极大值。 当我们向栈中压入一个元素 x 时，我们将 x 压入 stk1，并将 min(x, stk2[1]) 压入 stk2。 当我们从栈中弹出一个元素时，我们将 stk1 和 stk2 的栈顶元素都弹出。 当我们要获取当前栈中的栈顶元素时，我们只需要返回 stk1 的栈顶元素即可。 当我们要获取当前栈中的最小值时，我们只需要返回 stk2 的栈顶元素即可。 每个操作的时间复杂度为 O(1)。整体的空间复杂度为 O(n)，其中 n 为栈中元素的个数。", "tags": ["栈", "设计"], "url": "https://leetcode.cn/problems/min-stack/", "go": "type MinStack struct {\n\tstk1 []int\n\tstk2 []int\n}\n\nfunc Constructor() MinStack {\n\treturn MinStack{[]int{}, []int{math.MaxInt32}}\n}\n\nfunc (this *MinStack) Push(val int) {\n\tthis.stk1 = append(this.stk1, val)\n\tthis.stk2 = append(this.stk2, min(val, this.stk2[len(this.stk2)-1]))\n}\n\nfunc (this *MinStack) Pop() {\n\tthis.stk1 = this.stk1[:len(this.stk1)-1]\n\tthis.stk2 = this.stk2[:len(this.stk2)-1]\n}\n\nfunc (this *MinStack) Top() int {\n\treturn this.stk1[len(this.stk1)-1]\n}\n\nfunc (this *MinStack) GetMin() int {\n\treturn this.stk2[len(this.stk2)-1]\n}\n\n/**\n * Your MinStack object will be instantiated and called as such:\n * obj := Constructor();\n * obj.Push(val);\n * obj.Pop();\n * param_3 := obj.Top();\n * param_4 := obj.GetMin();\n */", "java": "class MinStack {\n    private Deque<Integer> stk1 = new ArrayDeque<>();\n    private Deque<Integer> stk2 = new ArrayDeque<>();\n\n    public MinStack() {\n        stk2.push(Integer.MAX_VALUE);\n    }\n\n    public void push(int val) {\n        stk1.push(val);\n        stk2.push(Math.min(val, stk2.peek()));\n    }\n\n    public void pop() {\n        stk1.pop();\n        stk2.pop();\n    }\n\n    public int top() {\n        return stk1.peek();\n    }\n\n    public int getMin() {\n        return stk2.peek();\n    }\n}\n\n/**\n * Your MinStack object will be instantiated and called as such:\n * MinStack obj = new MinStack();\n * obj.push(val);\n * obj.pop();\n * int param_3 = obj.top();\n * int param_4 = obj.getMin();\n */"}, {"id": 150, "title": "逆波兰表达式求值", "enTitle": "Evaluate Reverse Polish Notation", "category": "栈", "difficulty": "中等", "summary": "给你一个字符串数组 tokens ，表示一个根据 逆波兰表示法 表示的算术表达式。 请你计算该表达式。返回一个表示表达式值的整数。 注意： 有效的算符为 '+' 、 '' 、 '' 和 '/' 。 每个操作数（运算对象）都可以是一个整数或者另一个表达式。 两个整数之间的除法总是 向零截断 。 表达式中不含除零运算。 输入是一个根据逆波兰表示法表示的算术表达式。 答案及所有中间计算结果可以用 32 位 整数表示。 示例 1： 示例 2： …", "description": "给你一个字符串数组 tokens ，表示一个根据 逆波兰表示法 表示的算术表达式。\n请你计算该表达式。返回一个表示表达式值的整数。\n注意：\n• 有效的算符为 '+'、'-'、'*' 和 '/' 。\n• 每个操作数（运算对象）都可以是一个整数或者另一个表达式。\n• 两个整数之间的除法总是 向零截断 。\n• 表达式中不含除零运算。\n• 输入是一个根据逆波兰表示法表示的算术表达式。\n• 答案及所有中间计算结果可以用 32 位 整数表示。\n示例 1：\n输入：tokens = [\"2\",\"1\",\"+\",\"3\",\"*\"]\n输出：9\n解释：该算式转化为常见的中缀算术表达式为：((2 + 1) * 3) = 9\n示例 2：\n输入：tokens = [\"4\",\"13\",\"5\",\"/\",\"+\"]\n输出：6\n解释：该算式转化为常见的中缀算术表达式为：(4 + (13 / 5)) = 6\n示例 3：\n输入：tokens = [\"10\",\"6\",\"9\",\"3\",\"+\",\"-11\",\"*\",\"/\",\"*\",\"17\",\"+\",\"5\",\"+\"]\n输出：22\n解释：该算式转化为常见的中缀算术表达式为：\n((10 * (6 / ((9 + 3) * -11))) + 17) + 5\n= ((10 * (6 / (12 * -11))) + 17) + 5\n= ((10 * (6 / -132)) + 17) + 5\n= ((10 * 0) + 17) + 5\n= (0 + 17) + 5\n= 17 + 5\n= 22\n提示：\n• 1 <= tokens.length <= 104\n• tokens[i] 是一个算符（\"+\"、\"-\"、\"*\" 或 \"/\"），或是在范围 [-200, 200] 内的一个整数\n逆波兰表达式：\n逆波兰表达式是一种后缀表达式，所谓后缀就是指算符写在后面。\n• 平常使用的算式则是一种中缀表达式，如 ( 1 + 2 ) * ( 3 + 4 ) 。\n• 该算式的逆波兰表达式写法为 ( ( 1 2 + ) ( 3 4 + ) * ) 。\n逆波兰表达式主要有以下两个优点：\n• 去掉括号后表达式无歧义，上式即便写成 1 2 + 3 4 + * 也可以依据次序计算出正确结果。\n• 适合用栈操作运算：遇到数字则入栈；遇到算符则取出栈顶两个数字进行计算，并将结果压入栈中", "idea": "方法一", "tags": ["栈", "数组", "数学"], "url": "https://leetcode.cn/problems/evaluate-reverse-polish-notation/", "go": "func evalRPN(tokens []string) int {\n\t// https://github.com/emirpasic/gods#arraystack\n\tstk := arraystack.New()\n\tfor _, token := range tokens {\n\t\tif len(token) > 1 || token[0] >= '0' && token[0] <= '9' {\n\t\t\tnum, _ := strconv.Atoi(token)\n\t\t\tstk.Push(num)\n\t\t} else {\n\t\t\ty := popInt(stk)\n\t\t\tx := popInt(stk)\n\t\t\tswitch token {\n\t\t\tcase \"+\":\n\t\t\t\tstk.Push(x + y)\n\t\t\tcase \"-\":\n\t\t\t\tstk.Push(x - y)\n\t\t\tcase \"*\":\n\t\t\t\tstk.Push(x * y)\n\t\t\tdefault:\n\t\t\t\tstk.Push(x / y)\n\t\t\t}\n\t\t}\n\t}\n\treturn popInt(stk)\n}\n\nfunc popInt(stack *arraystack.Stack) int {\n\tv, _ := stack.Pop()\n\treturn v.(int)\n}", "java": "class Solution {\n    public int evalRPN(String[] tokens) {\n        Deque<Integer> stk = new ArrayDeque<>();\n        for (String t : tokens) {\n            if (t.length() > 1 || Character.isDigit(t.charAt(0))) {\n                stk.push(Integer.parseInt(t));\n            } else {\n                int y = stk.pop();\n                int x = stk.pop();\n                switch (t) {\n                case \"+\":\n                    stk.push(x + y);\n                    break;\n                case \"-\":\n                    stk.push(x - y);\n                    break;\n                case \"*\":\n                    stk.push(x * y);\n                    break;\n                default:\n                    stk.push(x / y);\n                    break;\n                }\n            }\n        }\n        return stk.pop();\n    }\n}"}, {"id": 739, "title": "每日温度", "enTitle": "Daily Temperatures", "category": "栈", "difficulty": "中等", "summary": "给定一个整数数组 temperatures ，表示每天的温度，返回一个数组 answer ，其中 answer[i] 是指对于第 i 天，下一个更高温度出现在几天后。如果气温在这之后都不会升高，请在该位置用 0 来代替。 示例 1: 示例 2: 示例 3: 提示： 1 <= temperatures.length <= 10 5 30 <= temperatures[i] <= 100", "description": "给定一个整数数组 temperatures ，表示每天的温度，返回一个数组 answer ，其中 answer[i] 是指对于第 i 天，下一个更高温度出现在几天后。如果气温在这之后都不会升高，请在该位置用 0 来代替。\n示例 1:\n输入: temperatures = [73,74,75,71,69,72,76,73]\n输出: [1,1,4,2,1,1,0,0]\n示例 2:\n输入: temperatures = [30,40,50,60]\n输出: [1,1,1,0]\n示例 3:\n输入: temperatures = [30,60,90]\n输出: [1,1,0]\n提示：\n• 1 <= temperatures.length <= 105\n• 30 <= temperatures[i] <= 100", "idea": "方法一：单调栈 本题需要我们找出每个元素右边第一个比它大的元素的位置，这是一个典型的单调栈应用场景。 我们从右往左遍历数组 \\textit{temperatures}，维护一个从栈顶到栈底温度单调递增的栈 \\textit{stk}，栈中存储的是数组元素的下标。对于每个元素 \\textit{temperatures}[i]，我们不断将其与栈顶元素进行比较，如果栈顶元素对应的温度小于等于 \\textit{temperatures}[i]，那么循环将栈顶元素弹出，直到栈为空或者栈顶元素对应的温度大于 \\textit{temperatures}[i]。此时，栈顶元素就是右边第一个比 \\textit{temperatures}[i] 大的元素，距离为 \\textit{stk.top()} i，我们更新答案数组。然后将 \\textit{temperatures}[i] 入栈，继续遍历。 遍历结束后，返回答案数组即可。 时间复杂度 O(n)，空间复杂度 O(n)。其中 n 为数组 \\textit{temperatures} 的长度。", "tags": ["栈", "数组", "单调栈"], "url": "https://leetcode.cn/problems/daily-temperatures/", "go": "func dailyTemperatures(temperatures []int) []int {\n\tn := len(temperatures)\n\tans := make([]int, n)\n\tstk := []int{}\n\tfor i := n - 1; i >= 0; i-- {\n\t\tfor len(stk) > 0 && temperatures[stk[len(stk)-1]] <= temperatures[i] {\n\t\t\tstk = stk[:len(stk)-1]\n\t\t}\n\t\tif len(stk) > 0 {\n\t\t\tans[i] = stk[len(stk)-1] - i\n\t\t}\n\t\tstk = append(stk, i)\n\t}\n\treturn ans\n}", "java": "class Solution {\n    public int[] dailyTemperatures(int[] temperatures) {\n        int n = temperatures.length;\n        Deque<Integer> stk = new ArrayDeque<>();\n        int[] ans = new int[n];\n        for (int i = n - 1; i >= 0; --i) {\n            while (!stk.isEmpty() && temperatures[stk.peek()] <= temperatures[i]) {\n                stk.pop();\n            }\n            if (!stk.isEmpty()) {\n                ans[i] = stk.peek() - i;\n            }\n            stk.push(i);\n        }\n        return ans;\n    }\n}"}, {"id": 853, "title": "车队", "enTitle": "Car Fleet", "category": "栈", "difficulty": "中等", "summary": "在一条单行道上，有 n 辆车开往同一目的地。目的地是几英里以外的 target 。 给定两个整数数组 position 和 speed ，长度都是 n ，其中 position[i] 是第 i 辆车的位置， speed[i] 是第 i 辆车的速度(单位是英里/小时)。 一辆车永远不会超过前面的另一辆车，但它可以追上去，并以较慢车的速度在另一辆车旁边行驶。 车队 是指并排行驶的一辆或几辆汽车。车队的速度是车队中 最慢 的车的速度。 即便一…", "description": "在一条单行道上，有 n 辆车开往同一目的地。目的地是几英里以外的 target 。\n给定两个整数数组 position 和 speed ，长度都是 n ，其中 position[i] 是第 i 辆车的位置， speed[i] 是第 i 辆车的速度(单位是英里/小时)。\n一辆车永远不会超过前面的另一辆车，但它可以追上去，并以较慢车的速度在另一辆车旁边行驶。\n车队 是指并排行驶的一辆或几辆汽车。车队的速度是车队中 最慢 的车的速度。\n即便一辆车在 target 才赶上了一个车队，它们仍然会被视作是同一个车队。\n返回到达目的地的车队数量 。\n示例 1：\n输入：target = 12, position = [10,8,0,5,3], speed = [2,4,1,1,3]\n输出：3\n解释：\n• 从 10（速度为 2）和 8（速度为 4）开始的车会组成一个车队，它们在 12 相遇。车队在 target 形成。\n• 从 0（速度为 1）开始的车不会追上其它任何车，所以它自己是一个车队。\n• 从 5（速度为 1） 和 3（速度为 3）开始的车组成一个车队，在 6 相遇。车队以速度 1 移动直到它到达 target。\n示例 2：\n输入：target = 10, position = [3], speed = [3]\n输出：1\n解释：\n只有一辆车，因此只有一个车队。\n示例 3：\n输入：target = 100, position = [0,2,4], speed = [4,2,1]\n输出：1\n解释：\n• 从 0（速度为 4） 和 2（速度为 2）开始的车组成一个车队，在 4 相遇。从 4 开始的车（速度为 1）移动到了 5。\n• 然后，在 4（速度为 2）的车队和在 5（速度为 1）的车成为一个车队，在 6 相遇。车队以速度 1 移动直到它到达 target。\n提示：\n• n == position.length == speed.length\n• 1 <= n <= 105\n• 0 < target <= 106\n• 0 <= position[i] < target\n• position 中每个值都 不同\n• 0 < speed[i] <= 106", "idea": "方法一：排序 我们将车辆按照位置降序排序，这样我们只需要比较相邻两辆车的到达时间即可。 我们初始化一个变量 pre 表示上一辆车到达终点的时间，如果当前车辆到达终点的时间大于 pre，说明当前车辆无法追上前面的车辆，因此需要另外开一个车队，否则当前车辆会与前面的车辆组成一个车队。 时间复杂度 O(n)，空间复杂度 O(n)。其中 n 是车辆的数量。", "tags": ["栈", "数组", "排序", "单调栈"], "url": "https://leetcode.cn/problems/car-fleet/", "go": "func carFleet(target int, position []int, speed []int) (ans int) {\n\tn := len(position)\n\tidx := make([]int, n)\n\tfor i := range idx {\n\t\tidx[i] = i\n\t}\n\tsort.Slice(idx, func(i, j int) bool { return position[idx[j]] < position[idx[i]] })\n\tvar pre float64\n\tfor _, i := range idx {\n\t\tt := float64(target-position[i]) / float64(speed[i])\n\t\tif t > pre {\n\t\t\tans++\n\t\t\tpre = t\n\t\t}\n\t}\n\treturn\n}", "java": "class Solution {\n    public int carFleet(int target, int[] position, int[] speed) {\n        int n = position.length;\n        Integer[] idx = new Integer[n];\n        Arrays.setAll(idx, i -> i);\n        Arrays.sort(idx, (i, j) -> position[j] - position[i]);\n        int ans = 0;\n        double pre = 0;\n        for (int i : idx) {\n            double t = 1.0 * (target - position[i]) / speed[i];\n            if (t > pre) {\n                ++ans;\n                pre = t;\n            }\n        }\n        return ans;\n    }\n}"}, {"id": 84, "title": "柱状图中最大的矩形", "enTitle": "Largest Rectangle In Histogram", "category": "栈", "difficulty": "困难", "summary": "给定 n 个非负整数，用来表示柱状图中各个柱子的高度。每个柱子彼此相邻，且宽度为 1 。 求在该柱状图中，能够勾勒出来的矩形的最大面积。 示例 1: 示例 2： 提示： 1 5 0 4", "description": "给定 n 个非负整数，用来表示柱状图中各个柱子的高度。每个柱子彼此相邻，且宽度为 1 。\n求在该柱状图中，能够勾勒出来的矩形的最大面积。\n示例 1:\n输入：heights = [2,1,5,6,2,3]\n输出：10\n解释：最大的矩形为图中红色区域，面积为 10\n示例 2：\n输入： heights = [2,4]\n输出： 4\n提示：\n• 1 5\n• 0 4", "idea": "方法一：单调栈 我们可以枚举每根柱子的高度 h 作为矩形的高度，利用单调栈，向左右两边找第一个高度小于 h 的下标 lefti, righti。那么此时矩形面积为 h \\times (rightilefti1)，求最大值即可。 时间复杂度 O(n)，空间复杂度 O(n)。其中 n 表示 heights 的长度。 单调栈常见模型：找出每个数左/右边离它最近的且比它大/小的数。模板： python stk = [] for i in range(n): while stk and check(stk[1], i): stk.pop() stk.append(i)", "tags": ["栈", "数组", "单调栈"], "url": "https://leetcode.cn/problems/largest-rectangle-in-histogram/", "go": "func largestRectangleArea(heights []int) int {\n\tres, n := 0, len(heights)\n\tvar stk []int\n\tleft, right := make([]int, n), make([]int, n)\n\tfor i := range right {\n\t\tright[i] = n\n\t}\n\tfor i, h := range heights {\n\t\tfor len(stk) > 0 && heights[stk[len(stk)-1]] >= h {\n\t\t\tright[stk[len(stk)-1]] = i\n\t\t\tstk = stk[:len(stk)-1]\n\t\t}\n\t\tif len(stk) > 0 {\n\t\t\tleft[i] = stk[len(stk)-1]\n\t\t} else {\n\t\t\tleft[i] = -1\n\t\t}\n\t\tstk = append(stk, i)\n\t}\n\tfor i, h := range heights {\n\t\tres = max(res, h*(right[i]-left[i]-1))\n\t}\n\treturn res\n}", "java": "class Solution {\n    public int largestRectangleArea(int[] heights) {\n        int res = 0, n = heights.length;\n        Deque<Integer> stk = new ArrayDeque<>();\n        int[] left = new int[n];\n        int[] right = new int[n];\n        Arrays.fill(right, n);\n        for (int i = 0; i < n; ++i) {\n            while (!stk.isEmpty() && heights[stk.peek()] >= heights[i]) {\n                right[stk.pop()] = i;\n            }\n            left[i] = stk.isEmpty() ? -1 : stk.peek();\n            stk.push(i);\n        }\n        for (int i = 0; i < n; ++i) {\n            res = Math.max(res, heights[i] * (right[i] - left[i] - 1));\n        }\n        return res;\n    }\n}"}, {"id": 704, "title": "二分查找", "enTitle": "Binary Search", "category": "二分查找", "difficulty": "简单", "summary": "给定一个 n 个元素有序的（升序）整型数组 nums 和一个目标值 target ，写一个函数搜索 nums 中的 target ，如果 target 存在返回下标，否则返回 1 。 你必须编写一个具有 O(log n) 时间复杂度的算法。 示例 1: 示例 2: 提示： 你可以假设 nums 中的所有元素是不重复的。 n 将在 [1, 10000] 之间。 nums 的每个元素都将在 [9999, 9999] 之间。", "description": "给定一个 n 个元素有序的（升序）整型数组 nums 和一个目标值 target  ，写一个函数搜索 nums 中的 target，如果 target 存在返回下标，否则返回 -1。\n你必须编写一个具有 O(log n) 时间复杂度的算法。\n示例 1:\n输入: nums = [-1,0,3,5,9,12], target = 9\n输出: 4\n解释: 9 出现在 nums 中并且下标为 4\n示例 2:\n输入: nums = [-1,0,3,5,9,12], target = 2\n输出: -1\n解释: 2 不存在 nums 中因此返回 -1\n提示：\n• 你可以假设 nums 中的所有元素是不重复的。\n• n 将在 [1, 10000]之间。\n• nums 的每个元素都将在 [-9999, 9999]之间。", "idea": "方法一：二分查找 我们定义二分查找的左边界 l=0，右边界 r=n1。 每一次循环，我们计算中间位置 \\textit{mid}=(l+r)/2，然后比较 \\textit{nums}[\\textit{mid}] 和 \\textit{target} 的大小。 如果 \\textit{nums}[\\textit{mid}] \\geq \\textit{target}，说明 \\textit{target} 在左半部分，我们将右边界 r 移动到 \\textit{mid}； 否则，说明 \\textit{target} 在右半部分，我们将左边界 l 移动到 \\textit{mid}+1。 循环结束的条件是 l<r，此时 \\textit{nums}[l] 就是我们要找的目标值，如果 \\textit{nums}[l]=\\textit{target}，返回 l，否则返回 1。 时间复杂度 O(\\log n)，其中 n 是数组 \\textit{nums} 的长度。空间复杂度 O(1)。", "tags": ["数组", "二分查找"], "url": "https://leetcode.cn/problems/binary-search/", "go": "func search(nums []int, target int) int {\n\tl, r := 0, len(nums)-1\n\tfor l < r {\n\t\tmid := (l + r) >> 1\n\t\tif nums[mid] >= target {\n\t\t\tr = mid\n\t\t} else {\n\t\t\tl = mid + 1\n\t\t}\n\t}\n\tif nums[l] == target {\n\t\treturn l\n\t}\n\treturn -1\n}", "java": "class Solution {\n    public int search(int[] nums, int target) {\n        int l = 0, r = nums.length - 1;\n        while (l < r) {\n            int mid = (l + r) >> 1;\n            if (nums[mid] >= target) {\n                r = mid;\n            } else {\n                l = mid + 1;\n            }\n        }\n        return nums[l] == target ? l : -1;\n    }\n}"}, {"id": 74, "title": "搜索二维矩阵", "enTitle": "Search a 2D Matrix", "category": "二分查找", "difficulty": "中等", "summary": "给你一个满足下述两条属性的 m x n 整数矩阵： 每行中的整数从左到右按非严格递增顺序排列。 每行的第一个整数大于前一行的最后一个整数。 给你一个整数 target ，如果 target 在矩阵中，返回 true ；否则，返回 false 。 你必须编写一个时间复杂度为 O(log(m n)) 的解决方案。 示例 1： 示例 2： 提示： m == matrix.length n == matrix[i].length 1 <= m,…", "description": "给你一个满足下述两条属性的 m x n 整数矩阵：\n• 每行中的整数从左到右按非严格递增顺序排列。\n• 每行的第一个整数大于前一行的最后一个整数。\n给你一个整数 target ，如果 target 在矩阵中，返回 true ；否则，返回 false 。\n你必须编写一个时间复杂度为 O(log(m * n)) 的解决方案。\n示例 1：\n输入：matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 3\n输出：true\n示例 2：\n输入：matrix = [[1,3,5,7],[10,11,16,20],[23,30,34,60]], target = 13\n输出：false\n提示：\n• m == matrix.length\n• n == matrix[i].length\n• 1 <= m, n <= 100\n• -104 <= matrix[i][j], target <= 104", "idea": "方法一：二分查找 我们将二维矩阵逻辑展开，然后二分查找即可。 时间复杂度 O(\\log (m \\times n))。其中 m 和 n 分别是矩阵的行数和列数。空间复杂度 O(1)。", "tags": ["数组", "二分查找", "矩阵"], "url": "https://leetcode.cn/problems/search-a-2d-matrix/", "go": "func searchMatrix(matrix [][]int, target int) bool {\n\tm, n := len(matrix), len(matrix[0])\n\tleft, right := 0, m*n-1\n\tfor left < right {\n\t\tmid := (left + right) >> 1\n\t\tx, y := mid/n, mid%n\n\t\tif matrix[x][y] >= target {\n\t\t\tright = mid\n\t\t} else {\n\t\t\tleft = mid + 1\n\t\t}\n\t}\n\treturn matrix[left/n][left%n] == target\n}", "java": "class Solution {\n    public boolean searchMatrix(int[][] matrix, int target) {\n        int m = matrix.length, n = matrix[0].length;\n        int left = 0, right = m * n - 1;\n        while (left < right) {\n            int mid = (left + right) >> 1;\n            int x = mid / n, y = mid % n;\n            if (matrix[x][y] >= target) {\n                right = mid;\n            } else {\n                left = mid + 1;\n            }\n        }\n        return matrix[left / n][left % n] == target;\n    }\n}"}, {"id": 875, "title": "爱吃香蕉的珂珂", "enTitle": "Koko Eating Bananas", "category": "二分查找", "difficulty": "中等", "summary": "珂珂喜欢吃香蕉。这里有 n 堆香蕉，第 i 堆中有 piles[i] 根香蕉。警卫已经离开了，将在 h 小时后回来。 珂珂可以决定她吃香蕉的速度 k （单位：根/小时）。每个小时，她将会选择一堆香蕉，从中吃掉 k 根。如果这堆香蕉少于 k 根，她将吃掉这堆的所有香蕉，然后这一小时内不会再吃更多的香蕉。 珂珂喜欢慢慢吃，但仍然想在警卫回来前吃掉所有的香蕉。 返回她可以在 h 小时内吃掉所有香蕉的最小速度 k （ k 为整数）。 示例 1：…", "description": "珂珂喜欢吃香蕉。这里有 n 堆香蕉，第 i 堆中有 piles[i] 根香蕉。警卫已经离开了，将在 h 小时后回来。\n珂珂可以决定她吃香蕉的速度 k （单位：根/小时）。每个小时，她将会选择一堆香蕉，从中吃掉 k 根。如果这堆香蕉少于 k 根，她将吃掉这堆的所有香蕉，然后这一小时内不会再吃更多的香蕉。\n珂珂喜欢慢慢吃，但仍然想在警卫回来前吃掉所有的香蕉。\n返回她可以在 h 小时内吃掉所有香蕉的最小速度 k（k 为整数）。\n示例 1：\n输入：piles = [3,6,7,11], h = 8\n输出：4\n示例 2：\n输入：piles = [30,11,23,4,20], h = 5\n输出：30\n示例 3：\n输入：piles = [30,11,23,4,20], h = 6\n输出：23\n提示：\n• 1 <= piles.length <= 104\n• piles.length <= h <= 109\n• 1 <= piles[i] <= 109", "idea": "方法一：二分查找 我们注意到，如果珂珂能够以 k 的速度在 h 小时内吃完所有香蕉，那么她也可以以 k' k 的速度在 h 小时内吃完所有香蕉。这存在着单调性，因此我们可以使用二分查找，找到最小的满足条件的 k。 我们定义二分查找的左边界 l = 1，右边界 r = \\max(\\textit{piles})。每一次二分，我们取中间值 mid = \\frac{l + r}{2}，然后计算以 mid 的速度吃香蕉需要的时间 s。如果 s \\leq h，说明 mid 的速度可以满足条件，我们将右边界 r 更新为 mid；否则，我们将左边界 l 更新为 mid + 1。最终，当 l = r 时，我们找到了最小的满足条件的 k。 时间复杂度 O(n \\times \\log M)，其中 n 和 M 分别是数组 \\textit{piles} 的长度和最大值。空间复杂度 O(1)。", "tags": ["数组", "二分查找"], "url": "https://leetcode.cn/problems/koko-eating-bananas/", "go": "func minEatingSpeed(piles []int, h int) int {\n\treturn 1 + sort.Search(slices.Max(piles), func(k int) bool {\n\t\tk++\n\t\ts := 0\n\t\tfor _, x := range piles {\n\t\t\ts += (x + k - 1) / k\n\t\t}\n\t\treturn s <= h\n\t})\n}", "java": "class Solution {\n    public int minEatingSpeed(int[] piles, int h) {\n        int l = 1, r = (int) 1e9;\n        while (l < r) {\n            int mid = (l + r) >> 1;\n            int s = 0;\n            for (int x : piles) {\n                s += (x + mid - 1) / mid;\n            }\n            if (s <= h) {\n                r = mid;\n            } else {\n                l = mid + 1;\n            }\n        }\n        return l;\n    }\n}"}, {"id": 153, "title": "寻找旋转排序数组中的最小值", "enTitle": "Find Minimum In Rotated Sorted Array", "category": "二分查找", "difficulty": "中等", "summary": "已知一个长度为 n 的数组，预先按照升序排列，经由 1 到 n 次 旋转 后，得到输入数组。例如，原数组 nums = [0,1,2,4,5,6,7] 在变化后可能得到： 若旋转 4 次，则可以得到 [4,5,6,7,0,1,2] 若旋转 7 次，则可以得到 [0,1,2,4,5,6,7] 注意，数组 [a[0], a[1], a[2], ..., a[n1]] 旋转一次 的结果为数组 [a[n1], a[0], a[1], a[2],…", "description": "已知一个长度为 n 的数组，预先按照升序排列，经由 1 到 n 次 旋转 后，得到输入数组。例如，原数组 nums = [0,1,2,4,5,6,7] 在变化后可能得到：\n• 若旋转 4 次，则可以得到 [4,5,6,7,0,1,2]\n• 若旋转 7 次，则可以得到 [0,1,2,4,5,6,7]\n注意，数组 [a[0], a[1], a[2], ..., a[n-1]] 旋转一次 的结果为数组 [a[n-1], a[0], a[1], a[2], ..., a[n-2]] 。\n给你一个元素值 互不相同 的数组 nums ，它原来是一个升序排列的数组，并按上述情形进行了多次旋转。请你找出并返回数组中的 最小元素 。\n你必须设计一个时间复杂度为 O(log n) 的算法解决此问题。\n示例 1：\n输入：nums = [3,4,5,1,2]\n输出：1\n解释：原数组为 [1,2,3,4,5] ，旋转 3 次得到输入数组。\n示例 2：\n输入：nums = [4,5,6,7,0,1,2]\n输出：0\n解释：原数组为 [0,1,2,4,5,6,7] ，旋转 4 次得到输入数组。\n示例 3：\n输入：nums = [11,13,15,17]\n输出：11\n解释：原数组为 [11,13,15,17] ，旋转 4 次得到输入数组。\n提示：\n• n == nums.length\n• 1 <= n <= 5000\n• -5000 <= nums[i] <= 5000\n• nums 中的所有整数 互不相同\n• nums 原来是一个升序排序的数组，并进行了 1 至 n 次旋转", "idea": "方法一：二分查找 我们可以使用二分查找来解决这个问题。 首先，我们定义两个指针 l 和 r，分别指向数组的起始位置和结束位置。然后，我们进入一个循环，直到 l 小于 r。 在每次循环中，我们计算中间位置 mid，并比较 nums[mid] 和 nums[n1] 的值。如果 nums[mid] 大于 nums[n1]，说明最小值在 mid 的右侧，因此我们将 l 更新为 mid + 1。否则，最小值在 mid 的左侧或 mid 本身，因此我们将 r 更新为 mid。当循环结束时，指针 l 将指向最小值的位置，我们返回 nums[l] 即可。 时间复杂度 O(\\log n)，其中 n 是数组 \\textit{nums} 的长度。空间复杂度 O(1)。", "tags": ["数组", "二分查找"], "url": "https://leetcode.cn/problems/find-minimum-in-rotated-sorted-array/", "go": "func findMin(nums []int) int {\n\tl, r := 0, len(nums)-1\n\tfor l < r {\n\t\tmid := (l + r) >> 1\n\t\tif nums[mid] > nums[len(nums)-1] {\n\t\t\tl = mid + 1\n\t\t} else {\n\t\t\tr = mid\n\t\t}\n\t}\n\treturn nums[l]\n}", "java": "class Solution {\n    public int findMin(int[] nums) {\n        int l = 0, r = nums.length - 1;\n        while (l < r) {\n            int mid = (l + r) >> 1;\n            if (nums[mid] > nums[nums.length - 1]) {\n                l = mid + 1;\n            } else {\n                r = mid;\n            }\n        }\n        return nums[l];\n    }\n}"}, {"id": 33, "title": "搜索旋转排序数组", "enTitle": "Search In Rotated Sorted Array", "category": "二分查找", "difficulty": "中等", "summary": "整数数组 nums 按升序排列，数组中的值 互不相同 。 在传递给函数之前， nums 在预先未知的某个下标 k （ 0 <= k < nums.length ）上进行了 向左旋转 ，使数组变为 [nums[k], nums[k+1], ..., nums[n1], nums[0], nums[1], ..., nums[k1]] （下标 从 0 开始 计数）。例如， [0,1,2,4,5,6,7] 下标 3 上向左旋转后可能变为 [4…", "description": "整数数组 nums 按升序排列，数组中的值 互不相同 。\n在传递给函数之前，nums 在预先未知的某个下标 k（0 <= k < nums.length）上进行了 向左旋转，使数组变为 [nums[k], nums[k+1], ..., nums[n-1], nums[0], nums[1], ..., nums[k-1]]（下标 从 0 开始 计数）。例如， [0,1,2,4,5,6,7] 下标 3 上向左旋转后可能变为 [4,5,6,7,0,1,2] 。\n给你 旋转后 的数组 nums 和一个整数 target ，如果 nums 中存在这个目标值 target ，则返回它的下标，否则返回 -1 。\n你必须设计一个时间复杂度为 O(log n) 的算法解决此问题。\n示例 1：\n输入：nums = [4,5,6,7,0,1,2], target = 0\n输出：4\n示例 2：\n输入：nums = [4,5,6,7,0,1,2], target = 3\n输出：-1\n示例 3：\n输入：nums = [1], target = 0\n输出：-1\n提示：\n• 1 <= nums.length <= 5000\n• -104 <= nums[i] <= 104\n• nums 中的每个值都 独一无二\n• 题目数据保证 nums 在预先未知的某个下标上进行了旋转\n• -104 <= target <= 104", "idea": "方法一：二分查找 我们使用二分，将数组分割成 [left,.. mid], [mid + 1,.. right] 两部分，这时候可以发现，其中有一部分一定是有序的。 因此，我们可以根据有序的那一部分，判断 target 是否在这一部分中： 若 [0,.. mid] 范围内的元素构成有序数组： 若满足 nums[0] \\leq target \\leq nums[mid]，那么我们搜索范围可以缩小为 [left,.. mid]； 否则，在 [mid + 1,.. right] 中查找； 若 [mid + 1, n 1] 范围内的元素构成有序数组： 若满足 nums[mid] \\lt target \\leq nums[n 1]，那么我们搜索范围可以缩小为 [mid + 1,.. right]； 否则，在 [left,.. mid] 中查找。 二分查找终止条件是 left \\geq right，若结束后发现 nums[left] 与 target 不等，说明数组中不存在值为 target 的元素，返回 1，否则返回下标 left。 时间复杂度 O(\\log n)，其中 n 是数组 nums 的长度。空间复杂度 O(1)。", "tags": ["数组", "二分查找"], "url": "https://leetcode.cn/problems/search-in-rotated-sorted-array/", "go": "func search(nums []int, target int) int {\n\tn := len(nums)\n\tleft, right := 0, n-1\n\tfor left < right {\n\t\tmid := (left + right) >> 1\n\t\tif nums[0] <= nums[mid] {\n\t\t\tif nums[0] <= target && target <= nums[mid] {\n\t\t\t\tright = mid\n\t\t\t} else {\n\t\t\t\tleft = mid + 1\n\t\t\t}\n\t\t} else {\n\t\t\tif nums[mid] < target && target <= nums[n-1] {\n\t\t\t\tleft = mid + 1\n\t\t\t} else {\n\t\t\t\tright = mid\n\t\t\t}\n\t\t}\n\t}\n\tif nums[left] == target {\n\t\treturn left\n\t}\n\treturn -1\n}", "java": "class Solution {\n    public int search(int[] nums, int target) {\n        int n = nums.length;\n        int left = 0, right = n - 1;\n        while (left < right) {\n            int mid = (left + right) >> 1;\n            if (nums[0] <= nums[mid]) {\n                if (nums[0] <= target && target <= nums[mid]) {\n                    right = mid;\n                } else {\n                    left = mid + 1;\n                }\n            } else {\n                if (nums[mid] < target && target <= nums[n - 1]) {\n                    left = mid + 1;\n                } else {\n                    right = mid;\n                }\n            }\n        }\n        return nums[left] == target ? left : -1;\n    }\n}"}, {"id": 981, "title": "基于时间的键值存储", "enTitle": "Time Based Key Value Store", "category": "二分查找", "difficulty": "中等", "summary": "设计一个基于时间的键值数据结构，该结构可以在不同时间戳存储对应同一个键的多个值，并针对特定时间戳检索键对应的值。 实现 TimeMap 类： TimeMap() 初始化数据结构对象 void set(String key, String value, int timestamp) 存储给定时间戳 timestamp 时的键 key 和值 value 。 String get(String key, int timestamp) 返回一个…", "description": "设计一个基于时间的键值数据结构，该结构可以在不同时间戳存储对应同一个键的多个值，并针对特定时间戳检索键对应的值。\n实现 TimeMap 类：\n• TimeMap() 初始化数据结构对象\n• void set(String key, String value, int timestamp) 存储给定时间戳 timestamp 时的键 key 和值 value。\n• String get(String key, int timestamp) 返回一个值，该值在之前调用了 set，其中 timestamp_prev <= timestamp 。如果有多个这样的值，它将返回与最大  timestamp_prev 关联的值。如果没有值，则返回空字符串（\"\"）。\n示例 1：\n输入：\n[\"TimeMap\", \"set\", \"get\", \"get\", \"set\", \"get\", \"get\"]\n[[], [\"foo\", \"bar\", 1], [\"foo\", 1], [\"foo\", 3], [\"foo\", \"bar2\", 4], [\"foo\", 4], [\"foo\", 5]]\n输出：\n[null, null, \"bar\", \"bar\", null, \"bar2\", \"bar2\"]\n解释：\nTimeMap timeMap = new TimeMap();\ntimeMap.set(\"foo\", \"bar\", 1); // 存储键 \"foo\" 和值 \"bar\" ，时间戳 timestamp = 1\ntimeMap.get(\"foo\", 1); // 返回 \"bar\"\ntimeMap.get(\"foo\", 3); // 返回 \"bar\", 因为在时间戳 3 和时间戳 2 处没有对应 \"foo\" 的值，所以唯一的值位于时间戳 1 处（即 \"bar\"） 。\ntimeMap.set(\"foo\", \"bar2\", 4); // 存储键 \"foo\" 和值 \"bar2\" ，时间戳 timestamp = 4\ntimeMap.get(\"foo\", 4); // 返回 \"bar2\"\ntimeMap.get(\"foo\", 5); // 返回 \"bar2\"\n提示：\n• 1 <= key.length, value.length <= 100\n• key 和 value 由小写英文字母和数字组成\n• 1 <= timestamp <= 107\n• set 操作中的时间戳 timestamp 都是严格递增的\n• 最多调用 set 和 get 操作 2 * 105 次", "idea": "方法一：哈希表 + 有序集合（或二分查找） 我们可以用哈希表 \\textit{kvt} 记录键值对，其中键为字符串 \\textit{key}，值为一个有序集合，集合中的每个元素为一个二元组 (\\textit{timestamp}, \\textit{value})，表示键 \\textit{key} 在时间戳 \\textit{timestamp} 时对应的值为 \\textit{value}。 当我们需要查询键 \\textit{key} 在时间戳 \\textit{timestamp} 时对应的值时，我们可以通过有序集合的方法找到最大的时间戳 \\textit{timestamp}'，使得 \\textit{timestamp}' \\leq \\textit{timestamp}，然后返回对应的值即可。 时间复杂度方面，对于 \\textit{set} 操作，由于哈希表的插入操作的时间复杂度为 O(1)，因此时间复杂度为 O(1)。对于 \\textit{get} 操作，由于哈希表的查找操作的时间复杂度为 O(1)，而有序集合的查找操作的时间复杂度为 O(\\log n)，因此时间复杂度为 O(\\log n)。空间复杂度为 O(n)，其中 n …", "tags": ["设计", "哈希表", "字符串", "二分查找"], "url": "https://leetcode.cn/problems/time-based-key-value-store/", "go": "type TimeMap struct {\n\tktv map[string][]pair\n}\n\nfunc Constructor() TimeMap {\n\treturn TimeMap{map[string][]pair{}}\n}\n\nfunc (this *TimeMap) Set(key string, value string, timestamp int) {\n\tthis.ktv[key] = append(this.ktv[key], pair{timestamp, value})\n}\n\nfunc (this *TimeMap) Get(key string, timestamp int) string {\n\tpairs := this.ktv[key]\n\ti := sort.Search(len(pairs), func(i int) bool { return pairs[i].t > timestamp })\n\tif i > 0 {\n\t\treturn pairs[i-1].v\n\t}\n\treturn \"\"\n}\n\ntype pair struct {\n\tt int\n\tv string\n}\n\n/**\n * Your TimeMap object will be instantiated and called as such:\n * obj := Constructor();\n * obj.Set(key,value,timestamp);\n * param_2 := obj.Get(key,timestamp);\n */", "java": "class TimeMap {\n    private Map<String, TreeMap<Integer, String>> ktv = new HashMap<>();\n\n    public TimeMap() {\n    }\n\n    public void set(String key, String value, int timestamp) {\n        ktv.computeIfAbsent(key, k -> new TreeMap<>()).put(timestamp, value);\n    }\n\n    public String get(String key, int timestamp) {\n        if (!ktv.containsKey(key)) {\n            return \"\";\n        }\n        var tv = ktv.get(key);\n        Integer t = tv.floorKey(timestamp);\n        return t == null ? \"\" : tv.get(t);\n    }\n}\n\n/**\n * Your TimeMap object will be instantiated and called as such:\n * TimeMap obj = new TimeMap();\n * obj.set(key,value,timestamp);\n * String param_2 = obj.get(key,timestamp);\n */"}, {"id": 206, "title": "反转链表", "enTitle": "Reverse Linked List", "category": "链表", "difficulty": "简单", "summary": "给你单链表的头节点 head ，请你反转链表，并返回反转后的链表。 示例 1： 示例 2： 示例 3： 提示： 链表中节点的数目范围是 [0, 5000] 5000 进阶： 链表可以选用迭代或递归方式完成反转。你能否用两种方法解决这道题？", "description": "给你单链表的头节点 head ，请你反转链表，并返回反转后的链表。\n示例 1：\n输入：head = [1,2,3,4,5]\n输出：[5,4,3,2,1]\n示例 2：\n输入：head = [1,2]\n输出：[2,1]\n示例 3：\n输入：head = []\n输出：[]\n提示：\n• 链表中节点的数目范围是 [0, 5000]\n• -5000\n进阶：链表可以选用迭代或递归方式完成反转。你能否用两种方法解决这道题？", "idea": "方法一：头插法 我们创建一个虚拟头节点 \\textit{dummy}，然后遍历链表，将每个节点依次插入 \\textit{dummy} 的下一个节点。遍历结束，返回 \\textit{dummy.next}。 时间复杂度 O(n)，其中 n 为链表的长度。空间复杂度 O(1)。", "tags": ["递归", "链表"], "url": "https://leetcode.cn/problems/reverse-linked-list/", "go": "/**\n * Definition for singly-linked list.\n * type ListNode struct {\n *     Val int\n *     Next *ListNode\n * }\n */\nfunc reverseList(head *ListNode) *ListNode {\n\tdummy := &ListNode{}\n\tcurr := head\n\tfor curr != nil {\n\t\tnext := curr.Next\n\t\tcurr.Next = dummy.Next\n\t\tdummy.Next = curr\n\t\tcurr = next\n\t}\n\treturn dummy.Next\n}", "java": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode reverseList(ListNode head) {\n        ListNode dummy = new ListNode();\n        ListNode curr = head;\n        while (curr != null) {\n            ListNode next = curr.next;\n            curr.next = dummy.next;\n            dummy.next = curr;\n            curr = next;\n        }\n        return dummy.next;\n    }\n}"}, {"id": 21, "title": "合并两个有序链表", "enTitle": "Merge Two Sorted Lists", "category": "链表", "difficulty": "简单", "summary": "将两个升序链表合并为一个新的 升序 链表并返回。新链表是通过拼接给定的两个链表的所有节点组成的。 示例 1： 示例 2： 示例 3： 提示： 两个链表的节点数目范围是 [0, 50] 100 l1 和 l2 均按 非递减顺序 排列", "description": "将两个升序链表合并为一个新的 升序 链表并返回。新链表是通过拼接给定的两个链表的所有节点组成的。\n示例 1：\n输入：l1 = [1,2,4], l2 = [1,3,4]\n输出：[1,1,2,3,4,4]\n示例 2：\n输入：l1 = [], l2 = []\n输出：[]\n示例 3：\n输入：l1 = [], l2 = [0]\n输出：[0]\n提示：\n• 两个链表的节点数目范围是 [0, 50]\n• -100\n• l1 和 l2 均按 非递减顺序 排列", "idea": "方法一：递归 我们先判断链表 l1 和 l2 是否为空，若其中一个为空，则返回另一个链表。否则，我们比较 l1 和 l2 的头节点： 若 l1 的头节点的值小于等于 l2 的头节点的值，则递归调用函数 mergeTwoLists(l1.next, l2)，并将 l1 的头节点与返回的链表头节点相连，返回 l1 的头节点。 否则，递归调用函数 mergeTwoLists(l1, l2.next)，并将 l2 的头节点与返回的链表头节点相连，返回 l2 的头节点。 时间复杂度 O(m + n)，空间复杂度 O(m + n)。其中 m 和 n 分别为两个链表的长度。", "tags": ["递归", "链表"], "url": "https://leetcode.cn/problems/merge-two-sorted-lists/", "go": "/**\n * Definition for singly-linked list.\n * type ListNode struct {\n *     Val int\n *     Next *ListNode\n * }\n */\nfunc mergeTwoLists(list1 *ListNode, list2 *ListNode) *ListNode {\n\tif list1 == nil {\n\t\treturn list2\n\t}\n\tif list2 == nil {\n\t\treturn list1\n\t}\n\tif list1.Val <= list2.Val {\n\t\tlist1.Next = mergeTwoLists(list1.Next, list2)\n\t\treturn list1\n\t} else {\n\t\tlist2.Next = mergeTwoLists(list1, list2.Next)\n\t\treturn list2\n\t}\n}", "java": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public ListNode mergeTwoLists(ListNode list1, ListNode list2) {\n        if (list1 == null) {\n            return list2;\n        }\n        if (list2 == null) {\n            return list1;\n        }\n        if (list1.val <= list2.val) {\n            list1.next = mergeTwoLists(list1.next, list2);\n            return list1;\n        } else {\n            list2.next = mergeTwoLists(list1, list2.next);\n            return list2;\n        }\n    }\n}"}, {"id": 141, "title": "环形链表", "enTitle": "Linked List Cycle", "category": "链表", "difficulty": "简单", "summary": "给你一个链表的头节点 head ，判断链表中是否有环。 如果链表中有某个节点，可以通过连续跟踪 next 指针再次到达，则链表中存在环。 为了表示给定链表中的环，评测系统内部使用整数 pos 来表示链表尾连接到链表中的位置（索引从 0 开始）。 注意： pos 不作为参数进行传递 。仅仅是为了标识链表的实际情况。 如果链表中存在环 ，则返回 true 。 否则，返回 false 。 示例 1： 示例 2： 示例 3： 提示： 链表中节点…", "description": "给你一个链表的头节点 head ，判断链表中是否有环。\n如果链表中有某个节点，可以通过连续跟踪 next 指针再次到达，则链表中存在环。 为了表示给定链表中的环，评测系统内部使用整数 pos 来表示链表尾连接到链表中的位置（索引从 0 开始）。注意：pos 不作为参数进行传递 。仅仅是为了标识链表的实际情况。\n如果链表中存在环 ，则返回 true 。 否则，返回 false 。\n示例 1：\n输入：head = [3,2,0,-4], pos = 1\n输出：true\n解释：链表中有一个环，其尾部连接到第二个节点。\n示例 2：\n输入：head = [1,2], pos = 0\n输出：true\n解释：链表中有一个环，其尾部连接到第一个节点。\n示例 3：\n输入：head = [1], pos = -1\n输出：false\n解释：链表中没有环。\n提示：\n• 链表中节点的数目范围是 [0, 104]\n• -105 <= Node.val <= 105\n• pos 为 -1 或者链表中的一个 有效索引 。\n进阶：你能用 O(1)（即，常量）内存解决此问题吗？", "idea": "方法一：哈希表 我们可以遍历链表，用一个哈希表 s 记录每个节点。当某个节点二次出现时，则表示存在环，直接返回 true。否则链表遍历结束，返回 false。 时间复杂度 O(n)，空间复杂度 O(n)。其中 n 是链表中的节点数。", "tags": ["哈希表", "链表", "双指针"], "url": "https://leetcode.cn/problems/linked-list-cycle/", "go": "/**\n * Definition for singly-linked list.\n * type ListNode struct {\n *     Val int\n *     Next *ListNode\n * }\n */\nfunc hasCycle(head *ListNode) bool {\n\ts := map[*ListNode]bool{}\n\tfor ; head != nil; head = head.Next {\n\t\tif s[head] {\n\t\t\treturn true\n\t\t}\n\t\ts[head] = true\n\t}\n\treturn false\n}", "java": "/**\n * Definition for singly-linked list.\n * class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode(int x) {\n *         val = x;\n *         next = null;\n *     }\n * }\n */\npublic class Solution {\n    public boolean hasCycle(ListNode head) {\n        Set<ListNode> s = new HashSet<>();\n        for (; head != null; head = head.next) {\n            if (!s.add(head)) {\n                return true;\n            }\n        }\n        return false;\n    }\n}"}, {"id": 143, "title": "重排链表", "enTitle": "Reorder List", "category": "链表", "difficulty": "中等", "summary": "给定一个单链表 L 的头节点 head ，单链表 L 表示为： 请将其重新排列后变为： 不能只是单纯的改变节点内部的值，而是需要实际的进行节点交换。 示例 1： 示例 2： 提示： 链表的长度范围为 [1, 5 10 4 ] 1 <= node.val <= 1000", "description": "给定一个单链表 L 的头节点 head ，单链表 L 表示为：\nL0 → L1 → … → Ln - 1 → Ln\n请将其重新排列后变为：\nL0 → Ln → L1 → Ln - 1 → L2 → Ln - 2 → …\n不能只是单纯的改变节点内部的值，而是需要实际的进行节点交换。\n示例 1：\n输入：head = [1,2,3,4]\n输出：[1,4,2,3]\n示例 2：\n输入：head = [1,2,3,4,5]\n输出：[1,5,2,4,3]\n提示：\n• 链表的长度范围为 [1, 5 * 104]\n• 1 <= node.val <= 1000", "idea": "方法一：快慢指针 + 反转链表 + 合并链表 我们先用快慢指针找到链表的中点，然后将链表的后半部分反转，最后将左右两个链表合并。 时间复杂度 O(n)，其中 n 是链表的长度。空间复杂度 O(1)。", "tags": ["栈", "递归", "链表", "双指针"], "url": "https://leetcode.cn/problems/reorder-list/", "go": "/**\n * Definition for singly-linked list.\n * type ListNode struct {\n *     Val int\n *     Next *ListNode\n * }\n */\nfunc reorderList(head *ListNode) {\n\t// 快慢指针找到链表中点\n\tfast, slow := head, head\n\tfor fast.Next != nil && fast.Next.Next != nil {\n\t\tslow, fast = slow.Next, fast.Next.Next\n\t}\n\n\t// cur 指向右半部分链表\n\tcur := slow.Next\n\tslow.Next = nil\n\n\t// 反转右半部分链表\n\tvar pre *ListNode\n\tfor cur != nil {\n\t\tt := cur.Next\n\t\tcur.Next = pre\n\t\tpre, cur = cur, t\n\t}\n\tcur = head\n\n\t// 此时 cur, pre 分别指向链表左右两半的第一个节点\n\t// 合并\n\tfor pre != nil {\n\t\tt := pre.Next\n\t\tpre.Next = cur.Next\n\t\tcur.Next = pre\n\t\tcur, pre = pre.Next, t\n\t}\n}", "java": "/**\n * Definition for singly-linked list.\n * public class ListNode {\n *     int val;\n *     ListNode next;\n *     ListNode() {}\n *     ListNode(int val) { this.val = val; }\n *     ListNode(int val, ListNode next) { this.val = val; this.next = next; }\n * }\n */\nclass Solution {\n    public void reorderList(ListNode head) {\n        // 快慢指针找到链表中点\n        ListNode fast = head, slow = head;\n        while (fast.next != null && fast.next.next != null) {\n            slow = slow.next;\n            fast = fast.next.next;\n        }\n\n        // cur 指向右半部分链表\n        ListNode cur = slow.next;\n        slow.next = null;\n\n        // 反转右半部分链表\n        ListNode pre = null;\n        while (cur != null) {\n            ListNode t = cur.next;\n            cur.next = pre;\n            pre = cur;\n            cur = t;\n        }\n        cur = head;\n\n        // 此时 cur, pre 分别指向链表左右两半的第一个节点\n        // 合并\n        while (pre != null) {\n            ListNode t = pre.next;\n            pre.next = cur.next;\n            cur.next = pre;\n            cur = pre.next;\n            pre = t;\n        }\n    }\n}"}, {"id": 19, "title": "删除链表的倒数第 N 个结点", "enTitle": "Remove Nth Node From End of List", "category": "链表", "difficulty": "中等", "summary": "给你一个链表，删除链表的倒数第 n 个结点，并且返回链表的头结点。 示例 1： 示例 2： 示例 3： 提示： 链表中结点的数目为 sz 1 <= sz <= 30 0 <= Node.val <= 100 1 <= n <= sz 进阶： 你能尝试使用一趟扫描实现吗？", "description": "给你一个链表，删除链表的倒数第 n 个结点，并且返回链表的头结点。\n示例 1：\n输入：head = [1,2,3,4,5], n = 2\n输出：[1,2,3,5]\n示例 2：\n输入：head = [1], n = 1\n输出：[]\n示例 3：\n输入：head = [1,2], n = 1\n输出：[1]\n提示：\n• 链表中结点的数目为 sz\n• 1 <= sz <= 30\n• 0 <= Node.val <= 100\n• 1 <= n <= sz\n进阶：你能尝试使用一趟扫描实现吗？", "idea": "方法一：快慢指针 我们定义两个指针 fast 和 slow，初始时都指向链表的虚拟头结点 dummy。 接着 fast 指针先向前移动 n 步，然后 fast 和 slow 指针同时向前移动，直到 fast 指针到达链表的末尾。此时 slow.next 指针指向的结点就是倒数第 n 个结点的前驱结点，将其删除即可。 时间复杂度 O(n)，其中 n 为链表的长度。空间复杂度 O(1)。", "tags": ["链表", "双指针"], "url": "https://leetcode.cn/problems/remove-nth-node-from-end-of-list/", "go": "/**\n * Definition for singly-linked list.\n * type ListNode struct {\n *     Val int\n *     Next *ListNode\n * }\n */\nfunc removeNthFromEnd(head *ListNode, n int) *ListNode {\n\tdummy := &ListNode{0, head}\n\tfast, slow := dummy, dummy\n\tfor ; n > 0; n-- {\n\t\tfast = fast.Next\n\t}\n\tfor fast.Next != nil {\n\t\tslow, fast = slow.Next, fast.Next\n\t}\n\tslow.Next = slow.Next.Next\n\treturn dummy.Next\n
